name: ORVYQ Footage Acquisition

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: "Project directory id under projects/"
        type: string
        required: true
  push:
    branches:
      - "agent/**"
      - "claude/**"
    paths:
      - ".github/workflows/orvyq-footage-acquisition.yml"
      # Media storage policy lives here. Acquisition writes the clips, so a
      # change to how they are stored must be able to re-run acquisition
      # rather than waiting for an unrelated push.
      - ".gitattributes"
      - "schemas/footage_visual_decisions.schema.json"
      - "scripts/lib/orvyq-footage-visual-decisions.mjs"
      - "scripts/lib/orvyq-footage-visual-decisions.test.mjs"
      - "scripts/lib/orvyq-footage-candidates.mjs"
      - "scripts/lib/orvyq-footage-candidates.test.mjs"
      - "scripts/orvyq_footage_candidate_stage.mjs"
      - "scripts/orvyq_shortlist_footage_candidates.mjs"
      - "scripts/orvyq_apply_footage_candidate_selection.mjs"
      - "scripts/orvyq_apply_footage_candidate_overrides.mjs"
      - "scripts/orvyq_apply_footage_use_contracts.mjs"
      - "scripts/orvyq_prune_orphan_footage.mjs"
      - "scripts/orvyq_apply_footage_visual_decisions.mjs"
      - "scripts/orvyq_footage_visual_decisions.schema.test.mjs"
      - "scripts/orvyq_acquire_footage_demand.mjs"
      - "scripts/orvyq_fail_closed_pending_footage.mjs"
      - "scripts/orvyq_generate_footage_contact_sheets.mjs"
      - "scripts/orvyq_prepare_footage_review_queue.mjs"
      - "projects/*/direction/motion_hook.json"
      - "projects/*/research/footage_acquisition_plan.json"
      - "projects/*/research/footage_semantic_constraints.json"
      - "projects/*/research/footage_constraint_overrides.json"
      - "projects/*/research/footage_use_contracts.json"
      - "projects/*/research/footage_use_contract_overrides.json"
      - "projects/*/research/footage_visual_decisions*.json"
      # The inspected selection is the input acquisition exists to act on:
      # pushing it must be what starts the download.
      - "projects/*/research/footage_candidate_shortlist.json"
      - "projects/*/research/footage_candidate_selection.json"
      - "projects/*/research/visual_asset_requests.json"
      - "projects/*/research/visual_asset_reviews.json"

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: orvyq-footage-acquisition-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  acquire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      TARGET_BRANCH: ${{ github.ref_name }}
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          lfs: false
          fetch-depth: 2

      - name: Resolve selected project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PROJECT_ID="${{ inputs.project_id }}"
          else
            CHANGED_INPUT="$(
              git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" |
                grep -E '^projects/[^/]+/(direction/motion_hook|research/(footage_acquisition_plan|footage_semantic_constraints|footage_constraint_overrides|footage_use_contracts|footage_use_contract_overrides|footage_visual_decisions[^/]*|visual_asset_requests|visual_asset_reviews))\.json$' |
                head -n 1 || true
            )"
            if [ -n "$CHANGED_INPUT" ]; then
              PROJECT_ID="$(jq -r '.project_id' "$CHANGED_INPUT")"
            else
              mapfile -t CANDIDATES < <(
                find projects -path '*/research/footage_acquisition_plan.json' -type f -print0 |
                  while IFS= read -r -d '' plan; do
                    root="${plan%/research/footage_acquisition_plan.json}"
                    runtime="$root/assets/footage_acquisition.runtime.json"
                    reviews="$root/research/visual_asset_reviews.json"
                    planned="$(jq '.assets | length' "$plan")"
                    actual="$(test -f "$runtime" && jq '.records | length' "$runtime" || echo 0)"
                    rejected="$(test -f "$reviews" && jq '.summary.rejected_from_metadata // 0' "$reviews" || echo 0)"
                    pending="$(test -f "$reviews" && jq '.summary.pending_frame_review // 0' "$reviews" || echo 0)"
                    if [ "$actual" -ne "$planned" ] || [ "$rejected" -gt 0 ] || [ "$pending" -gt 0 ]; then
                      jq -r '.project_id' "$plan"
                    fi
                  done | sort -u
              )
              test "${#CANDIDATES[@]}" -eq 1 || {
                echo "::error::Could not resolve exactly one project needing footage work; found ${#CANDIDATES[@]}."
                exit 1
              }
              PROJECT_ID="${CANDIDATES[0]}"
            fi
          fi
          test -f "projects/$PROJECT_ID/research/footage_acquisition_plan.json"
          test -f "projects/$PROJECT_ID/research/footage_use_contracts.json"
          echo "project_id=$PROJECT_ID" >> "$GITHUB_OUTPUT"
          echo "PROJECT_ID=$PROJECT_ID" >> "$GITHUB_ENV"
          echo "Resolved project: $PROJECT_ID"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Stage contract-derived editorial footage assignments
        run: node scripts/orvyq_apply_footage_use_contracts.mjs --project-id="$PROJECT_ID" --editorial-only

      - name: Resolve the canonical editorial pause plan
        run: node scripts/orvyq_resolve_pauses.mjs --project-id="$PROJECT_ID"

      - name: Refresh the claim/slice topology from staged assignments
        run: node scripts/orvyq_full_production_plan.mjs --project-id="$PROJECT_ID" --defer-coverage-gate

      - name: Apply claim-bound footage use contracts
        run: node scripts/orvyq_apply_footage_use_contracts.mjs --project-id="$PROJECT_ID"

      - name: Build current claim-bound review queue
        run: node scripts/orvyq_prepare_footage_review_queue.mjs --project-id="$PROJECT_ID"

      - name: Apply all byte-bound visual decision rounds
        shell: bash
        run: |
          set -euo pipefail
          node scripts/orvyq_apply_footage_visual_decisions.mjs --project-id="$PROJECT_ID" | tee footage-decisions.log

      - name: Determine acquisition requirement
        shell: bash
        run: |
          set -euo pipefail
          ROOT="projects/$PROJECT_ID"
          PLANNED="$(jq '.assets | length' "$ROOT/research/footage_acquisition_plan.json")"
          ACTUAL="$(jq '.records | length' "$ROOT/assets/footage_acquisition.runtime.json")"
          REJECTED="$(jq '.summary.rejected_from_metadata // 0' "$ROOT/research/visual_asset_reviews.json")"
          # A scene whose acquired clip is not the one its inspection round
          # pinned counts as missing, not as filled. The count matching is
          # exactly how project 004 held 34 clips nobody had ever inspected.
          DRIFTED="$(node scripts/orvyq_pinned_selection_drift.mjs --project-id="$PROJECT_ID" | jq '.drifted_scene_ids | length')"
          if [ "$ACTUAL" -ne "$PLANNED" ] || [ "$REJECTED" -gt 0 ] || [ "$DRIFTED" -gt 0 ]; then
            echo "NEEDS_ACQUISITION=true" >> "$GITHUB_ENV"
            echo "Reacquisition required: planned=$PLANNED actual=$ACTUAL rejected=$REJECTED drifted=$DRIFTED"
          else
            echo "NEEDS_ACQUISITION=false" >> "$GITHUB_ENV"
            echo "No reacquisition required; review reconciliation only."
          fi

      - name: Apply project-authored footage constraint overrides
        if: env.NEEDS_ACQUISITION == 'true'
        shell: bash
        run: |
          set -euo pipefail
          BASE="projects/$PROJECT_ID/research/footage_semantic_constraints.json"
          OVERRIDE="projects/$PROJECT_ID/research/footage_constraint_overrides.json"
          if [ ! -f "$OVERRIDE" ]; then
            echo "No project-authored footage constraint overrides."
            exit 0
          fi
          test "$(jq -r '.project_id' "$OVERRIDE")" = "$PROJECT_ID"
          jq --slurpfile override "$OVERRIDE" '.scenes = (.scenes * $override[0].scenes) | .request_revision = ((.request_revision // 0) + 1)' "$BASE" > "$BASE.tmp"
          mv "$BASE.tmp" "$BASE"

      - name: Verify Pexels credential exists
        if: env.NEEDS_ACQUISITION == 'true'
        run: |
          set -euo pipefail
          test -n "$PEXELS_API_KEY" || { echo "::error::Repository secret PEXELS_API_KEY is missing."; exit 1; }

      # Look before choosing. A rejected pinned asset invalidates the old
      # selection: publish boards only for the active rejections and wait for
      # a new inspected choice. Never silently substitute a search result.
      - name: Decide whether candidates still need inspecting
        shell: bash
        run: |
          set -euo pipefail
          node scripts/orvyq_footage_candidate_stage.mjs --project-id="$PROJECT_ID" | tee footage-candidate-stage.json
          STAGE="$(jq -r '.stage' footage-candidate-stage.json)"
          REPLACEMENT_ONLY="$(jq -r '.replacement_only' footage-candidate-stage.json)"
          echo "CANDIDATE_STAGE=$STAGE" >> "$GITHUB_ENV"
          echo "CANDIDATE_REPLACEMENT_ONLY=$REPLACEMENT_ONLY" >> "$GITHUB_ENV"
          echo "Candidate stage: $STAGE (replacement_only=$REPLACEMENT_ONLY)"

      - name: Install media probe
        if: env.NEEDS_ACQUISITION == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Build candidate boards for inspection
        if: env.NEEDS_ACQUISITION == 'true' && env.CANDIDATE_STAGE == 'shortlist'
        shell: bash
        run: |
          set -euo pipefail
          EXTRA_ARGS=()
          if [ "$CANDIDATE_REPLACEMENT_ONLY" = "true" ]; then
            EXTRA_ARGS+=(--replacement-only)
          fi
          node scripts/orvyq_shortlist_footage_candidates.mjs --project-id="$PROJECT_ID" "${EXTRA_ARGS[@]}" 2>&1 | tee footage-shortlist.log

      - name: Pin the plan to the inspected selection
        if: env.NEEDS_ACQUISITION == 'true' && env.CANDIDATE_STAGE == 'apply'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/orvyq_apply_footage_candidate_selection.mjs --project-id="$PROJECT_ID" 2>&1 | tee footage-selection.log

      - name: Reacquire rejected licensed contextual footage
        if: env.NEEDS_ACQUISITION == 'true' && env.CANDIDATE_STAGE == 'apply'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/orvyq_acquire_footage_demand.mjs --project-id="$PROJECT_ID" 2>&1 | tee footage-acquisition.log
          node scripts/orvyq_apply_footage_use_contracts.mjs --project-id="$PROJECT_ID"
          node scripts/orvyq_fail_closed_pending_footage.mjs --project-id="$PROJECT_ID"
          node scripts/orvyq_generate_footage_contact_sheets.mjs --project-id="$PROJECT_ID"
          node scripts/orvyq_prune_orphan_footage.mjs --project-id="$PROJECT_ID"

      - name: Reconcile decisions against replacement bytes
        shell: bash
        run: |
          set -euo pipefail
          node scripts/orvyq_apply_footage_use_contracts.mjs --project-id="$PROJECT_ID"
          node scripts/orvyq_prepare_footage_review_queue.mjs --project-id="$PROJECT_ID"
          node scripts/orvyq_apply_footage_visual_decisions.mjs --project-id="$PROJECT_ID" | tee -a footage-decisions.log
          node scripts/orvyq_prepare_footage_review_queue.mjs --project-id="$PROJECT_ID"
          node scripts/orvyq_apply_footage_visual_decisions.mjs --project-id="$PROJECT_ID" | tee -a footage-decisions.log

      - name: Resolve static semantic QA state
        shell: bash
        run: |
          set -euo pipefail
          ROOT="projects/$PROJECT_ID"
          REJECTED="$(jq '.summary.rejected_from_metadata // 0' "$ROOT/research/visual_asset_reviews.json")"
          PENDING="$(jq '.summary.pending_frame_review // 0' "$ROOT/research/visual_asset_reviews.json")"
          BLOCKED_REQUESTS="$(jq '[.requests[] | select(.status != "ready")] | length' "$ROOT/research/visual_asset_requests.json")"
          PLAN_STATUS="$(jq -r '.status' "$ROOT/direction/visual_rebalance_plan.json")"
          BLUEPRINT_STATUS="$(jq -r '.full_production.status' "$ROOT/direction/editorial_blueprint.json")"
          if [ "$REJECTED" -eq 0 ] && [ "$PENDING" -eq 0 ] && [ "$BLOCKED_REQUESTS" -eq 0 ] && [ "$PLAN_STATUS" = "materialized" ] && [ "$BLUEPRINT_STATUS" = "ready" ]; then
            echo "READY_FOR_STATIC_QA=true" >> "$GITHUB_ENV"
          else
            echo "READY_FOR_STATIC_QA=false" >> "$GITHUB_ENV"
          fi
          printf 'rejected=%s pending=%s blocked_requests=%s plan=%s blueprint=%s\n' "$REJECTED" "$PENDING" "$BLOCKED_REQUESTS" "$PLAN_STATUS" "$BLUEPRINT_STATUS" | tee footage-review-state.log

      - name: Run final local footage and semantic audits
        if: env.READY_FOR_STATIC_QA == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/orvyq_validate_local_footage.mjs --project-id="$PROJECT_ID"
          node scripts/orvyq_footage_semantic_review_audit.mjs --project-id="$PROJECT_ID"
          node scripts/orvyq_visual_rebalance_audit.mjs --project-id="$PROJECT_ID"

      - name: Verify compact footage is stored as normal Git media
        if: env.NEEDS_ACQUISITION == 'true'
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' media; do
            attr="$(git check-attr filter -- "$media")"
            if grep -q 'filter: lfs$' <<<"$attr"; then
              echo "::error::$media is still routed through Git LFS: $attr"
              exit 1
            fi
            bytes="$(stat -c '%s' "$media")"
            if [ "$bytes" -ge 95000000 ]; then
              echo "::error::$media is $bytes bytes; compact normal-Git footage must stay below 95 MB."
              exit 1
            fi
          done < <(find "projects/$PROJECT_ID/assets/footage" -maxdepth 1 -type f -name '*.mp4' -print0)

      - name: Commit footage state and review queue
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          # An unmatched glob must vanish rather than reach git as a literal.
          shopt -s nullglob
          ROOT="projects/$PROJECT_ID"

          # Several of these only exist once a project has been through the
          # stage that writes them. A project being bootstrapped, or rebuilt
          # after its pool was retired, legitimately has none of them yet --
          # and `git add` on a path that does not exist fails the whole step.
          add_existing() {
            local force="$1"; shift
            local present=()
            local candidate
            for candidate in "$@"; do
              [ -e "$candidate" ] && present+=("$candidate")
            done
            [ "${#present[@]}" -eq 0 ] && return 0
            if [ "$force" = "force" ]; then
              git add -f -- "${present[@]}"
            else
              git add -- "${present[@]}"
            fi
          }

          add_existing tracked \
            "scripts/orvyq_acquire_footage_demand.mjs" \
            "$ROOT/research/footage_acquisition_plan.json" \
            "$ROOT/research/footage_semantic_constraints.json" \
            "$ROOT/research/footage_constraint_overrides.json" \
            "$ROOT/research/footage_use_contracts.json" \
            "$ROOT/research/footage_use_contract_overrides.json" \
            "$ROOT/research/visual_asset_requests.json" \
            "$ROOT/research/visual_asset_reviews.json" \
            "$ROOT/research/footage_candidate_shortlist.json" \
            "$ROOT/research/footage_candidate_selection.json" \
            "$ROOT/config/editorial_asset_plan.json" \
            "$ROOT/direction/motion_hook.json" \
            "$ROOT/direction/visual_rebalance_plan.json" \
            "$ROOT/direction/editorial_blueprint.json" \
            "$ROOT/research"/footage_visual_decisions*.json

          add_existing force \
            "$ROOT/assets/footage" \
            "$ROOT/assets/local_assets.json" \
            "$ROOT/assets/footage_acquisition.runtime.json" \
            "$ROOT/qa/local_assets.provenance.json" \
            "$ROOT/qa/footage-contact-sheets" \
            "$ROOT/qa/footage-candidate-boards" \
            "$ROOT/qa/footage_contact_sheets.json" \
            "$ROOT/qa/footage_review_queue.json" \
            "$ROOT/qa/footage_semantic_review_audit.json"

          git config user.name "orvyq-footage-bot"
          git config user.email "orvyq-footage-bot@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "Footage state and review queue unchanged; nothing to commit."
            exit 0
          fi
          if [ "$NEEDS_ACQUISITION" = "true" ] && [ "$CANDIDATE_STAGE" = "shortlist" ]; then
            git commit -m "Publish footage candidate boards for $PROJECT_ID"
          elif [ "$NEEDS_ACQUISITION" = "true" ]; then
            git commit -m "Reacquire claim-bound footage for $PROJECT_ID"
          else
            git commit -m "Reconcile claim-bound footage review for $PROJECT_ID"
          fi
          # Topology and pause-resolution passes also refresh derived tracked
          # diagnostics that do not belong in this narrowly scoped footage
          # commit. Preserve them across the concurrency rebase instead of
          # letting an otherwise valid 45/45 review fail at the final push.
          git pull --rebase --autostash origin "$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Validate automation-authored head commit
        if: steps.commit.outputs.pushed == 'true'
        uses: ./.github/actions/dispatch-required-checks
        with:
          branch: ${{ env.TARGET_BRANCH }}

      - name: Upload acquisition and review diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orvyq-footage-review-${{ steps.project.outputs.project_id }}-${{ github.run_id }}
          retention-days: 30
          path: |
            footage-acquisition.log
            footage-shortlist.log
            footage-selection.log
            footage-candidate-stage.json
            projects/${{ steps.project.outputs.project_id }}/research/footage_candidate_shortlist.json
            projects/${{ steps.project.outputs.project_id }}/qa/footage-candidate-boards/*.jpg
            footage-decisions.log
            footage-review-state.log
            projects/${{ steps.project.outputs.project_id }}/research/footage_acquisition_plan.json
            projects/${{ steps.project.outputs.project_id }}/research/footage_semantic_constraints.json
            projects/${{ steps.project.outputs.project_id }}/research/footage_constraint_overrides.json
            projects/${{ steps.project.outputs.project_id }}/research/footage_use_contracts.json
            projects/${{ steps.project.outputs.project_id }}/research/footage_use_contract_overrides.json
            projects/${{ steps.project.outputs.project_id }}/research/footage_visual_decisions*.json
            projects/${{ steps.project.outputs.project_id }}/research/visual_asset_requests.json
            projects/${{ steps.project.outputs.project_id }}/research/visual_asset_reviews.json
            projects/${{ steps.project.outputs.project_id }}/config/editorial_asset_plan.json
            projects/${{ steps.project.outputs.project_id }}/direction/motion_hook.json
            projects/${{ steps.project.outputs.project_id }}/direction/visual_rebalance_plan.json
            projects/${{ steps.project.outputs.project_id }}/direction/editorial_blueprint.json
            projects/${{ steps.project.outputs.project_id }}/assets/footage_acquisition.runtime.json
            projects/${{ steps.project.outputs.project_id }}/assets/local_assets.json
            projects/${{ steps.project.outputs.project_id }}/assets/footage/*.provenance.json
            projects/${{ steps.project.outputs.project_id }}/qa/local_assets.provenance.json
            projects/${{ steps.project.outputs.project_id }}/qa/footage_contact_sheets.json
            projects/${{ steps.project.outputs.project_id }}/qa/footage_review_queue.json
            projects/${{ steps.project.outputs.project_id }}/qa/footage_semantic_review_audit.json
            projects/${{ steps.project.outputs.project_id }}/qa/footage-contact-sheets/*.jpg
          if-no-files-found: warn

      - name: Report footage preparation on the active pull request
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          PROJECT_ID: ${{ steps.project.outputs.project_id }}
        run: |
          PROJECT_LABEL="${PROJECT_ID:-unresolved}"
          DETAILS="$(cat footage-review-state.log 2>/dev/null || tail -n 20 footage-acquisition.log 2>/dev/null || true)"
          BODY="Footage preparation finished with **${JOB_STATUS}**. Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}. Target: \`${PROJECT_LABEL}\` on \`${TARGET_BRANCH}\`. Reacquisition: \`${NEEDS_ACQUISITION:-unknown}\`."
          if [ -n "$DETAILS" ]; then
            BODY="${BODY}"$'\n\n```text\n'"${DETAILS}"$'\n```'
          fi
          PR_NUMBER="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$TARGET_BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$PR_NUMBER" ]; then
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$BODY" ||
              echo "::warning::Could not post the footage preparation result to PR #$PR_NUMBER."
          fi
