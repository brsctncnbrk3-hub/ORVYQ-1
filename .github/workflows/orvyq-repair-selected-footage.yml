name: ORVYQ Replace Rejected Footage

on:
  push:
    branches:
      - "agent/project-001-clean-rebuild"
    paths:
      - "projects/004-the-ai-race-clean-rebuild/config/footage_candidate_overrides.json"
      - "scripts/orvyq_acquire_selected_pexels.mjs"
      - ".github/workflows/orvyq-repair-selected-footage.yml"

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: orvyq-replace-rejected-footage-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  replace:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PROJECT_ID: 004-the-ai-race-clean-rebuild
      TARGET_BRANCH: agent/project-001-clean-rebuild
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/project-001-clean-rebuild
          lfs: true
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies and media tooling
        run: |
          set -euo pipefail
          npm ci
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          git lfs version

      - name: Record rejected identities and apply candidate overrides
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import path from 'node:path';
          import { promises as fs } from 'node:fs';
          const root = path.join('projects', process.env.PROJECT_ID);
          const override = JSON.parse(await fs.readFile(path.join(root, 'config', 'footage_candidate_overrides.json'), 'utf8'));
          const queue = JSON.parse(await fs.readFile(path.join(root, 'qa', 'footage_review_queue.json'), 'utf8'));
          const reviewsPath = path.join(root, 'research', 'visual_asset_reviews.json');
          const reviews = JSON.parse(await fs.readFile(reviewsPath, 'utf8'));
          const queueByScene = new Map(queue.entries.map((entry) => [entry.scene_id, entry]));
          const existing = new Set((reviews.rejected_assets || []).map((item) => `${item.scene_id}:${item.provider_asset_id}:${item.asset_sha256 || ''}`));
          reviews.rejected_assets ||= [];
          for (const item of override.overrides) {
            const entry = queueByScene.get(item.scene_id);
            if (!entry) throw new Error(`${item.scene_id}: current review queue entry is missing`);
            const key = `${entry.scene_id}:${entry.provider_asset_id}:${entry.asset_sha256}`;
            if (existing.has(key)) continue;
            reviews.rejected_assets.push({
              scene_id: entry.scene_id,
              provider_asset_id: String(entry.provider_asset_id),
              asset_path: entry.asset_path,
              asset_sha256: entry.asset_sha256,
              reason: String(item.reason),
              rejected_at: override.requested_at,
            });
            existing.add(key);
          }
          reviews.summary ||= {};
          reviews.summary.rejected_from_metadata = reviews.rejected_assets.length;
          await fs.writeFile(reviewsPath, JSON.stringify(reviews, null, 2) + '\n');
          NODE
          node scripts/orvyq_apply_footage_candidate_overrides.mjs --project-id="$PROJECT_ID" | tee footage-override-application.log
          SCENE_IDS="$(jq -r '[.overrides[].scene_id] | join(",")' "projects/$PROJECT_ID/config/footage_candidate_overrides.json")"
          test -n "$SCENE_IDS"
          echo "SCENE_IDS=$SCENE_IDS" >> "$GITHUB_ENV"

      - name: Replace only rejected scenes
        shell: bash
        run: |
          set -euo pipefail
          node scripts/orvyq_acquire_selected_pexels.mjs --project-id="$PROJECT_ID" --scene-ids="$SCENE_IDS" | tee rejected-footage-replacement.log
          jq -e '.pass == true and .planned_asset_count == 41 and .acquired_this_run == 6 and .reused_existing == 35 and (.records | length) == 41 and (.unresolved_scene_ids | length) == 0' "projects/$PROJECT_ID/assets/footage_acquisition.runtime.json"

      - name: Verify all current media bytes
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' media; do
            count=$((count + 1))
            test "$(stat -c '%s' "$media")" -gt 100000
            ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 "$media" | grep -qx '1280,720'
          done < <(find "projects/$PROJECT_ID/assets/footage" -maxdepth 1 -type f -name '*.mp4' -print0)
          test "$count" -eq 41

      - name: Rebuild byte-bound four-position review package
        shell: bash
        run: |
          set -euo pipefail
          node scripts/orvyq_prepare_footage_review.mjs --project-id="$PROJECT_ID" | tee replacement-review-preparation.log
          jq -e '.pending_review_count == 41 and (.entries | length) == 41' "projects/$PROJECT_ID/qa/footage_review_queue.json"
          test "$(find "projects/$PROJECT_ID/qa/footage-contact-sheets" -maxdepth 1 -type f -name '*.jpg' | wc -l)" -eq 41

      - name: Commit and push replacement package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "orvyq-footage-replacement-bot"
          git config user.email "orvyq-footage-replacement-bot@users.noreply.github.com"
          git add -- \
            "projects/$PROJECT_ID/research/selected_pexels_manifest.json" \
            "projects/$PROJECT_ID/research/visual_asset_reviews.json"
          git add -f -- \
            "projects/$PROJECT_ID/assets/footage" \
            "projects/$PROJECT_ID/assets/local_assets.json" \
            "projects/$PROJECT_ID/assets/footage_acquisition.runtime.json" \
            "projects/$PROJECT_ID/qa/footage-contact-sheets" \
            "projects/$PROJECT_ID/qa/footage_review_queue.json"
          if git diff --cached --quiet; then
            echo "Replacement package is already published"
            exit 0
          fi
          git commit -m "Replace six rejected footage scenes for $PROJECT_ID"
          for attempt in 1 2 3; do
            if git pull --rebase origin "$TARGET_BRANCH" && git push origin "HEAD:$TARGET_BRANCH"; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 3))
          done
          echo "::error::Could not publish replacement package after three attempts"
          exit 1

      - name: Upload replacement review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orvyq-replacement-review-${{ env.PROJECT_ID }}-${{ github.run_id }}
          retention-days: 30
          path: |
            footage-override-application.log
            rejected-footage-replacement.log
            replacement-review-preparation.log
            projects/${{ env.PROJECT_ID }}/assets/footage_acquisition.runtime.json
            projects/${{ env.PROJECT_ID }}/qa/footage_review_queue.json
            projects/${{ env.PROJECT_ID }}/qa/footage-contact-sheets/*.jpg
          if-no-files-found: warn

      - name: Report replacement result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          SUMMARY="$(jq -c '{planned_asset_count,acquired_this_run,reused_existing,replacement_scene_ids,unresolved_scene_ids,pass}' "projects/$PROJECT_ID/assets/footage_acquisition.runtime.json" 2>/dev/null || true)"
          BODY="Six-scene footage replacement and four-position review preparation finished with **${JOB_STATUS}**. Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. No video render was started."
          test -z "$SUMMARY" || BODY="${BODY}"$'\n\n```json\n'"${SUMMARY}"$'\n```'
          gh api "repos/$GITHUB_REPOSITORY/issues/5/comments" -f body="$BODY" || true
