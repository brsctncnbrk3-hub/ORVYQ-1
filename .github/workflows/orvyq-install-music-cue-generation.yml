name: ORVYQ Install Music Cue Generation

on:
  push:
    branches:
      - "agent/project-001-clean-rebuild"
    paths:
      - "projects/004-the-ai-race-clean-rebuild/config/install_music_cue_generation_request.json"

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/project-001-clean-rebuild
          fetch-depth: 2

      - name: Install exact shot-derived cue generation step
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/orvyq-candidate-validation.yml')
          text = path.read_text()
          marker = '      - name: Build shot-derived canonical music cue sheet\n'
          resolve = '      - name: Resolve canonical music\n        run: node scripts/orvyq_music_resolve.mjs --project-id="$PROJECT_ID" --mode=full --target-duration-seconds="$CANDIDATE_DURATION_SECONDS"\n'
          insert = marker + '        run: node scripts/orvyq_build_music_cue_sheet.mjs --project-id="$PROJECT_ID" --target-duration-seconds="$CANDIDATE_DURATION_SECONDS"\n\n' + resolve
          if marker in text:
              print('Music cue generation step already installed')
          elif resolve in text:
              path.write_text(text.replace(resolve, insert, 1))
          else:
              raise SystemExit('Expected canonical music resolution step was not found; refusing to modify workflow')
          PY

      - name: Validate workflow patch
        run: |
          set -euo pipefail
          grep -Fq 'Build shot-derived canonical music cue sheet' .github/workflows/orvyq-candidate-validation.yml
          grep -Fq 'orvyq_build_music_cue_sheet.mjs' .github/workflows/orvyq-candidate-validation.yml
          node --check scripts/orvyq_build_music_cue_sheet.mjs

      - name: Upload installer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orvyq-music-cue-installer-${{ github.run_id }}
          retention-days: 30
          path: |
            .github/workflows/orvyq-candidate-validation.yml
            projects/004-the-ai-race-clean-rebuild/config/install_music_cue_generation_request.json
          if-no-files-found: warn

      - name: Commit maintenance patch
        run: |
          set -euo pipefail
          git config user.name "orvyq-maintenance-bot"
          git config user.email "orvyq-maintenance-bot@users.noreply.github.com"
          git add .github/workflows/orvyq-candidate-validation.yml
          if git diff --cached --quiet; then
            echo "No workflow change needed"
            exit 0
          fi
          git commit -m "Generate music cues from current production shots"
          git pull --rebase origin agent/project-001-clean-rebuild
          git push origin HEAD:agent/project-001-clean-rebuild

      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          BODY="Project 004 shot-derived music cue installer finished with **${JOB_STATUS}**. Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. No video render was started."
          gh api "repos/$GITHUB_REPOSITORY/issues/5/comments" -f body="$BODY" || true
