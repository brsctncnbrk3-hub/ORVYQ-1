name: ORVYQ Selected Pexels Acquisition

on:
  push:
    branches:
      - "agent/**"
      - "claude/**"
    paths:
      - "projects/*/research/selected_pexels_manifest.json"
      - "scripts/orvyq_acquire_selected_pexels.mjs"
      - "scripts/orvyq_prepare_footage_review.mjs"
      - ".github/workflows/orvyq-selected-pexels-acquisition.yml"

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: orvyq-selected-pexels-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  acquire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PROJECT_ID: 004-the-ai-race-clean-rebuild
      TARGET_BRANCH: ${{ github.ref_name }}
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          lfs: false
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies and media tooling
        run: |
          set -euo pipefail
          npm ci
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Validate repository media contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'force_original_aspect_ratio' scripts/orvyq_acquire_selected_pexels.mjs
          grep -q 'timeStretchFactor' scripts/orvyq_acquire_selected_pexels.mjs
          grep -q 'expectedCount' scripts/orvyq_prepare_footage_review.mjs

      - name: Complete the forty-one-scene twelve-second capacity plan
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import { promises as fs } from 'node:fs';
          const file = `projects/${process.env.PROJECT_ID}/research/selected_pexels_manifest.json`;
          const manifest = JSON.parse(await fs.readFile(file, 'utf8'));
          const additions = [
            {scene_id:'scene_031',claim_id:'CLM_004_TEST_NOT_DEPLOYMENT',provider_asset_ids:['6804123'],role:'human_context',min_duration_seconds:8,output_duration_seconds:12,narration_anchor:'These were designed tests, built specifically to see how far a model would go.',semantic_link:'physical',semantic_rationale:'A distinct developer-review setting adds controlled-test context without presenting stock footage as evidence of real deployment behavior.'},
            {scene_id:'scene_032',claim_id:'CLM_006_INVESTMENT_SCALE',provider_asset_ids:['7989454'],role:'human_context',min_duration_seconds:8,output_duration_seconds:12,narration_anchor:'The companies building frontier models are not operating like cautious scientific institutions.',semantic_link:'conceptual',semantic_rationale:'A second technical team working under visible pressure gives the investment race a human operational scale while Stanford data carries the number.'},
            {scene_id:'scene_033',claim_id:'CLM_016_COMPLIANCE_INCUMBENCY',provider_asset_ids:['7989455'],role:'human_context',min_duration_seconds:8,output_duration_seconds:12,narration_anchor:'Established companies may also be better able to absorb the complex compliance costs.',semantic_link:'physical',semantic_rationale:'A distinct small technical team reinforces the fixed-cost compliance analysis without claiming a measured outcome for any named firm.'},
            {scene_id:'scene_034',claim_id:'CLM_018_CLOSED_ACCESS_TRADEOFF',provider_asset_ids:['9460727'],role:'context',min_duration_seconds:8,output_duration_seconds:12,narration_anchor:'Closed models let a company monitor, restrict, and shut down misuse in real time.',semantic_link:'conceptual',semantic_rationale:'A second controlled-access sequence makes centralized permission and revocation visible without depicting a specific AI provider.'},
            {scene_id:'scene_035',claim_id:'CLM_020_INCIDENT_REPORTING',provider_asset_ids:['34838666'],role:'governance_context',min_duration_seconds:8,output_duration_seconds:12,narration_anchor:'mandatory incident reporting when systems misbehave',semantic_link:'conceptual',semantic_rationale:'A second formal policy meeting provides distinct reporting and oversight context without inventing a named hearing.'},
            {scene_id:'scene_036',claim_id:'CLM_006_INVESTMENT_SCALE',provider_asset_ids:['30289540'],role:'context',min_duration_seconds:8,output_duration_seconds:12,narration_anchor:'Competition is visible in the money, and in how narrow the frontier has become.',semantic_link:'conceptual',semantic_rationale:'A fresh capital-and-technology context candidate reserved for the investment-pressure section; the Stanford figure remains the factual evidence.'},
            {scene_id:'scene_037',claim_id:'CLM_006_INVESTMENT_SCALE',provider_asset_ids:['36435706'],role:'context',min_duration_seconds:8,output_duration_seconds:12,narration_anchor:'The companies building frontier models are operating like actors in a high-stakes competition.',semantic_link:'conceptual',semantic_rationale:'A second fresh market-and-infrastructure candidate broadens the race section without treating generic footage as proof of a specific investment.'},
            {scene_id:'scene_038',claim_id:'CLM_006_INVESTMENT_SCALE',provider_asset_ids:['36825184'],role:'context',min_duration_seconds:8,output_duration_seconds:12,narration_anchor:'Nearly thirty-four billion dollars in private generative-AI investment in 2024.',semantic_link:'conceptual',semantic_rationale:'A third fresh capital-flow candidate supplies cinematic coverage around the dated Stanford evidence without replacing the primary source.'},
            {scene_id:'scene_039',claim_id:'CLM_010_BIO_ASL3',provider_asset_ids:['5752559'],role:'human_context',min_duration_seconds:8,output_duration_seconds:12,narration_anchor:'On biological risk, Anthropic said its internal testing suggested a meaningful capability uplift.',semantic_link:'physical',semantic_rationale:'A fresh responsible-laboratory candidate adds biosafety context while avoiding weapon imagery and leaving all factual burden with the ASL-3 documents.'},
            {scene_id:'scene_040',claim_id:'CLM_010_BIO_ASL3',provider_asset_ids:['8381407'],role:'human_context',min_duration_seconds:8,output_duration_seconds:12,narration_anchor:'Anthropic responded by deploying the model under its higher ASL-3 safety standard.',semantic_link:'physical',semantic_rationale:'A second fresh protected-laboratory candidate supports safeguard narration without implying that the stock footage depicts Anthropic or a named facility.'},
            {scene_id:'scene_041',claim_id:'CLM_010_BIO_ASL3',provider_asset_ids:['9244463'],role:'human_context',min_duration_seconds:8,output_duration_seconds:12,narration_anchor:'The claim is not that the model can create a biological weapon on its own.',semantic_link:'physical',semantic_rationale:'A third fresh biosafety candidate sustains the limitation and precaution sequence without sensational imagery or reenactment.'}
          ];
          const existing = new Set(manifest.assets.map((asset) => asset.scene_id));
          for (const addition of additions) if (!existing.has(addition.scene_id)) manifest.assets.push(addition);
          for (const asset of manifest.assets) asset.output_duration_seconds = 12;
          manifest.request_revision = Math.max(Number(manifest.request_revision || 1), 5);
          manifest.selection_policy.maximum_output_duration_seconds = 12;
          if (manifest.assets.length !== 41) throw new Error(`Expected 41 selected scenes, found ${manifest.assets.length}`);
          await fs.writeFile(file, JSON.stringify(manifest, null, 2) + '\n');
          NODE

      - name: Acquire selected licensed Pexels footage
        shell: bash
        run: |
          set -euo pipefail
          node scripts/orvyq_acquire_selected_pexels.mjs --project-id="$PROJECT_ID" | tee selected-pexels-acquisition.log
          jq -e '.pass == true and .planned_asset_count == 41 and (.records | length) == 41' "projects/$PROJECT_ID/assets/footage_acquisition.runtime.json"

      - name: Verify compact normal-Git media
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' media; do
            bytes="$(stat -c '%s' "$media")"
            test "$bytes" -lt 95000000 || { echo "::error::$media exceeds 95 MB"; exit 1; }
            attr="$(git check-attr filter -- "$media")"
            ! grep -q 'filter: lfs$' <<<"$attr" || { echo "::error::$media is routed through Git LFS"; exit 1; }
            ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 "$media" | grep -qx '1280,720'
          done < <(find "projects/$PROJECT_ID/assets/footage" -maxdepth 1 -type f -name '*.mp4' -print0)

      - name: Build byte-bound four-position review package
        shell: bash
        run: |
          set -euo pipefail
          node scripts/orvyq_prepare_footage_review.mjs --project-id="$PROJECT_ID" | tee footage-review-preparation.log
          node scripts/orvyq_review_readiness_audit.mjs --project-id="$PROJECT_ID" --check-only | tee footage-review-readiness.log
          jq -e '.pending_review_count == 41 and (.entries | length) == 41' "projects/$PROJECT_ID/qa/footage_review_queue.json"

      - name: Commit footage and review package on latest branch head
        shell: bash
        run: |
          set -euo pipefail
          TARGET_BRANCH="$GITHUB_REF_NAME"
          PACKAGE_TAR="$RUNNER_TEMP/orvyq-footage-package.tar"
          PACKAGE_PATHS=(
            "projects/$PROJECT_ID/research/selected_pexels_manifest.json"
            "projects/$PROJECT_ID/assets/footage"
            "projects/$PROJECT_ID/assets/local_assets.json"
            "projects/$PROJECT_ID/assets/footage_acquisition.runtime.json"
            "projects/$PROJECT_ID/qa/footage-contact-sheets"
            "projects/$PROJECT_ID/qa/footage_review_queue.json"
          )
          tar -cf "$PACKAGE_TAR" "${PACKAGE_PATHS[@]}"
          git config user.name "orvyq-footage-bot"
          git config user.email "orvyq-footage-bot@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin "$TARGET_BRANCH"
            git reset --hard "origin/$TARGET_BRANCH"
            tar -xf "$PACKAGE_TAR"
            git add "projects/$PROJECT_ID/research/selected_pexels_manifest.json"
            git add -f \
              "projects/$PROJECT_ID/assets/footage" \
              "projects/$PROJECT_ID/assets/local_assets.json" \
              "projects/$PROJECT_ID/assets/footage_acquisition.runtime.json" \
              "projects/$PROJECT_ID/qa/footage-contact-sheets" \
              "projects/$PROJECT_ID/qa/footage_review_queue.json"
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Acquire and prepare forty-one footage scenes for $PROJECT_ID"
            if git push origin "HEAD:$TARGET_BRANCH"; then exit 0; fi
          done
          echo "::error::Could not publish the footage review package after three attempts"
          exit 1

      - name: Upload acquisition and review package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orvyq-footage-review-${{ env.PROJECT_ID }}-${{ github.run_id }}
          retention-days: 30
          path: |
            selected-pexels-acquisition.log
            footage-review-preparation.log
            footage-review-readiness.log
            projects/${{ env.PROJECT_ID }}/assets/footage_acquisition.runtime.json
            projects/${{ env.PROJECT_ID }}/qa/footage_review_queue.json
            projects/${{ env.PROJECT_ID }}/qa/footage-contact-sheets/*.jpg
          if-no-files-found: warn

      - name: Report acquisition result on active PR
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          SUMMARY="$(cat "projects/$PROJECT_ID/assets/footage_acquisition.runtime.json" 2>/dev/null | jq -c '{planned_asset_count,acquired_this_run,unresolved_scene_ids,pass}' || true)"
          BODY="Selected Pexels acquisition and four-position review preparation finished with **${JOB_STATUS}**. Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Project: \`${PROJECT_ID}\`. No video render was started."
          test -z "$SUMMARY" || BODY="${BODY}"$'\n\n```json\n'"${SUMMARY}"$'\n```'
          PR_NUMBER="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$TARGET_BRANCH" --state open --json number --jq '.[0].number // empty')"
          test -z "$PR_NUMBER" || gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$BODY"
