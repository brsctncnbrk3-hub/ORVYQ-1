name: ORVYQ Apply Footage Review

on:
  push:
    branches:
      - "agent/project-001-clean-rebuild"
    paths:
      - "projects/004-the-ai-race-clean-rebuild/config/footage_review_decisions.json"

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: orvyq-apply-footage-review-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PROJECT_ID: 004-the-ai-race-clean-rebuild
      TARGET_BRANCH: agent/project-001-clean-rebuild
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/project-001-clean-rebuild
          lfs: true
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Make approval cardinality project-driven
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/orvyq_apply_footage_review_decisions.mjs')
          text = p.read_text()
          old = '''  if (runtime.pass !== true || Number(runtime.planned_asset_count) !== 20 || (runtime.records || []).length !== 20) {
    throw new Error("Footage acquisition must pass with exactly 20 selected records before visual approval");
  }
  const entries = queue.entries || [];
  if (entries.length !== 20 || Number(queue.pending_review_count) !== 20) {
    throw new Error(`Review queue must contain exactly 20 pending entries, found ${entries.length}`);
  }
  const decisionList = decisions.decisions || [];
  if (decisionList.length !== 20) throw new Error(`Decision file must contain exactly 20 decisions, found ${decisionList.length}`);
  const decisionByScene = new Map(decisionList.map((decision) => [decision.scene_id, decision]));
  if (decisionByScene.size !== 20) throw new Error("Decision file contains duplicate scene ids");'''
          new = '''  const expectedCount = (runtime.records || []).length;
  if (
    runtime.pass !== true ||
    !expectedCount ||
    Number(runtime.planned_asset_count) !== expectedCount ||
    (runtime.unresolved_scene_ids || []).length !== 0
  ) {
    throw new Error(`Footage acquisition must pass with every selected record before visual approval (planned=${runtime.planned_asset_count}, records=${expectedCount})`);
  }
  const entries = queue.entries || [];
  if (entries.length !== expectedCount || Number(queue.pending_review_count) !== expectedCount) {
    throw new Error(`Review queue must contain exactly ${expectedCount} pending entries, found ${entries.length}`);
  }
  const decisionList = decisions.decisions || [];
  if (decisionList.length !== expectedCount) throw new Error(`Decision file must contain exactly ${expectedCount} decisions, found ${decisionList.length}`);
  const decisionByScene = new Map(decisionList.map((decision) => [decision.scene_id, decision]));
  if (decisionByScene.size !== expectedCount) throw new Error("Decision file contains duplicate scene ids");'''
          if old not in text:
            if 'const expectedCount = (runtime.records || []).length;' not in text:
              raise SystemExit('approval cardinality block not found')
          else:
            p.write_text(text.replace(old, new))
          PY

      - name: Apply byte-bound multiframe decisions
        run: node scripts/orvyq_apply_footage_review_decisions.mjs --project-id="$PROJECT_ID"

      - name: Verify all selected footage is locally approved
        run: node scripts/orvyq_materialize_footage.mjs --project-id="$PROJECT_ID"

      - name: Validate completed visual QA and projected readiness
        run: node scripts/orvyq_review_readiness_audit.mjs --project-id="$PROJECT_ID" --check-only

      - name: Validate canonical schemas and data contracts
        run: npm run validate:canonical

      - name: Upload review-application diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orvyq-footage-review-application-${{ github.run_id }}
          retention-days: 30
          path: |
            projects/${{ env.PROJECT_ID }}/config/footage_review_decisions.json
            projects/${{ env.PROJECT_ID }}/research/visual_asset_reviews.json
            projects/${{ env.PROJECT_ID }}/config/editorial_asset_plan.json
            projects/${{ env.PROJECT_ID }}/direction/motion_hook.json
            projects/${{ env.PROJECT_ID }}/direction/visual_rebalance_plan.json
          if-no-files-found: warn

      - name: Commit approved render-free project state on latest branch head
        run: |
          set -euo pipefail
          PACKAGE_TAR="$RUNNER_TEMP/orvyq-footage-approval-package.tar"
          PACKAGE_PATHS=(
            scripts/orvyq_apply_footage_review_decisions.mjs
            "projects/$PROJECT_ID/assets/footage"
            "projects/$PROJECT_ID/research/visual_asset_reviews.json"
            "projects/$PROJECT_ID/research/visual_asset_requests.json"
            "projects/$PROJECT_ID/config/editorial_asset_plan.json"
            "projects/$PROJECT_ID/direction/motion_hook.json"
            "projects/$PROJECT_ID/direction/visual_rebalance_plan.json"
            "projects/$PROJECT_ID/project.json"
            "projects/$PROJECT_ID/config/production_profile.json"
          )
          tar -cf "$PACKAGE_TAR" "${PACKAGE_PATHS[@]}"
          git config user.name "orvyq-footage-review-bot"
          git config user.email "orvyq-footage-review-bot@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin "$TARGET_BRANCH"
            git reset --hard "origin/$TARGET_BRANCH"
            tar -xf "$PACKAGE_TAR"
            git add scripts/orvyq_apply_footage_review_decisions.mjs
            git add -f "projects/$PROJECT_ID/assets/footage"/*.provenance.json
            git add \
              "projects/$PROJECT_ID/research/visual_asset_reviews.json" \
              "projects/$PROJECT_ID/research/visual_asset_requests.json" \
              "projects/$PROJECT_ID/config/editorial_asset_plan.json" \
              "projects/$PROJECT_ID/direction/motion_hook.json" \
              "projects/$PROJECT_ID/direction/visual_rebalance_plan.json" \
              "projects/$PROJECT_ID/project.json" \
              "projects/$PROJECT_ID/config/production_profile.json"
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Apply multiframe footage approvals for $PROJECT_ID"
            if git push origin "HEAD:$TARGET_BRANCH"; then exit 0; fi
          done
          echo "::error::Could not publish footage approvals after three attempts"
          exit 1

      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          BODY="Project 004 footage review decisions finished with **${JOB_STATUS}**. Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. No video render was started."
          gh api "repos/$GITHUB_REPOSITORY/issues/5/comments" -f body="$BODY" || true
