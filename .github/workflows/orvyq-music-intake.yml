name: ORVYQ Music Intake

# Manual maintenance workflow for adding a licensed track to the shared music
# registry. It is repository-wide, has no active-project assumption, and never
# renders video.
on:
  workflow_dispatch:
    inputs:
      recovery_mode:
        description: "Where to recover the exact source file from"
        type: choice
        options: [workflow_artifact, direct_url]
        required: true
      source_run_id:
        description: "(workflow_artifact) Workflow run ID that uploaded the artifact"
        type: string
        default: ""
      source_artifact_name:
        description: "(workflow_artifact) Artifact name"
        type: string
        default: ""
      source_path_in_artifact:
        description: "(workflow_artifact) Path to the audio file inside the artifact"
        type: string
        default: ""
      source_url:
        description: "(direct_url) Direct HTTPS URL to the licensed file"
        type: string
        default: ""
      track_id:
        description: "Canonical shared-library track id"
        type: string
        required: true
      title:
        type: string
        default: ""
      artist:
        type: string
        default: ""
      source_page_url:
        type: string
        default: ""
      license_name:
        type: string
        default: ""
      license_url:
        type: string
        default: ""
      attribution:
        type: string
        default: ""
      acquisition_provenance:
        description: "How the exact file was obtained and verified"
        type: string
        required: true
      approved_for_proof:
        type: boolean
        default: false
      approved_for_full:
        type: boolean
        default: false
      status:
        type: choice
        options: [approved, pending_review, rejected, deprecated]
        default: approved
      notes:
        type: string
        default: ""
      expected_sha256:
        description: "Optional exact expected SHA-256"
        type: string
        default: ""

permissions:
  contents: write
  actions: read

concurrency:
  group: orvyq-music-intake-${{ inputs.track_id }}
  cancel-in-progress: false

jobs:
  intake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Recover source file from workflow artifact
        if: inputs.recovery_mode == 'workflow_artifact'
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.source_artifact_name }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: recovered-artifact

      - name: Recover source file from direct URL
        if: inputs.recovery_mode == 'direct_url'
        run: |
          set -euo pipefail
          mkdir -p recovered-artifact
          curl -fsSL -o recovered-artifact/direct_download "${{ inputs.source_url }}"
          echo "AUTO_SOURCE_PATH=recovered-artifact/direct_download" >> "$GITHUB_ENV"

      - name: Locate artifact file and companion provenance
        if: inputs.recovery_mode == 'workflow_artifact'
        run: |
          set -euo pipefail
          SRC="recovered-artifact/${{ inputs.source_path_in_artifact }}"
          test -f "$SRC"
          echo "AUTO_SOURCE_PATH=$SRC" >> "$GITHUB_ENV"
          PROV="$(dirname "$SRC")/$(basename "$SRC" | sed 's/\.[^.]*$/.provenance.json/')"
          if [ -f "$PROV" ]; then
            node -e "
              const fs = require('fs');
              const p = JSON.parse(fs.readFileSync('$PROV', 'utf8'));
              fs.appendFileSync(process.env.GITHUB_ENV, [
                'AUTO_TITLE=' + (p.title || ''),
                'AUTO_ARTIST=' + (p.composer || p.artist || ''),
                'AUTO_SOURCE_PAGE=' + (p.source_page_url || ''),
                'AUTO_LICENSE_NAME=' + (p.license || p.license_name || ''),
                'AUTO_LICENSE_URL=' + (p.license_url || ''),
                'AUTO_ATTRIBUTION=' + (p.attribution || ''),
                'AUTO_SHA256=' + (p.sha256 || '')
              ].join('\n') + '\n');
            "
          fi

      - name: Run canonical music intake
        run: |
          set -euo pipefail
          TITLE="${{ inputs.title }}"; TITLE="${TITLE:-${AUTO_TITLE:-}}"
          ARTIST="${{ inputs.artist }}"; ARTIST="${ARTIST:-${AUTO_ARTIST:-}}"
          SOURCE_PAGE="${{ inputs.source_page_url }}"; SOURCE_PAGE="${SOURCE_PAGE:-${AUTO_SOURCE_PAGE:-}}"
          LICENSE_NAME="${{ inputs.license_name }}"; LICENSE_NAME="${LICENSE_NAME:-${AUTO_LICENSE_NAME:-}}"
          LICENSE_URL="${{ inputs.license_url }}"; LICENSE_URL="${LICENSE_URL:-${AUTO_LICENSE_URL:-}}"
          ATTRIBUTION="${{ inputs.attribution }}"; ATTRIBUTION="${ATTRIBUTION:-${AUTO_ATTRIBUTION:-}}"
          EXPECTED_SHA="${{ inputs.expected_sha256 }}"; EXPECTED_SHA="${EXPECTED_SHA:-${AUTO_SHA256:-}}"
          node scripts/orvyq_music_intake.mjs \
            --source="$AUTO_SOURCE_PATH" \
            --track-id="${{ inputs.track_id }}" \
            --title="$TITLE" \
            --artist="$ARTIST" \
            --source-page-url="$SOURCE_PAGE" \
            --license-name="$LICENSE_NAME" \
            --license-url="$LICENSE_URL" \
            --attribution="$ATTRIBUTION" \
            --acquisition-provenance="${{ inputs.acquisition_provenance }}" \
            --approved-for-proof="${{ inputs.approved_for_proof }}" \
            --approved-for-full="${{ inputs.approved_for_full }}" \
            --status="${{ inputs.status }}" \
            --notes="${{ inputs.notes }}" \
            --expected-sha256="$EXPECTED_SHA"

      - name: Validate repository and tests
        run: |
          npm run validate:canonical
          npm test

      - name: Commit shared music registry changes
        run: |
          set -euo pipefail
          git config user.name "orvyq-music-intake-bot"
          git config user.email "orvyq-music-intake-bot@users.noreply.github.com"
          git add -f music_library/
          if git diff --cached --quiet; then
            echo "No registry or asset changes"
            exit 0
          fi
          git commit -m "Music intake: vendor ${{ inputs.track_id }}"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
