name: ORVYQ Fix Selected Pexels Retry

on:
  push:
    branches:
      - "agent/project-001-clean-rebuild"
    paths:
      - ".github/workflows/orvyq-fix-selected-pexels-retry.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/project-001-clean-rebuild
          fetch-depth: 2

      - name: Patch acquisition and retry inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          script = Path('scripts/orvyq_acquire_selected_pexels.mjs')
          text = script.read_text()
          text = text.replace(
              'async function compact(source, output, durationSeconds) {\n  await execFileAsync("ffmpeg", [\n    "-y",\n    "-i", source,',
              'async function compact(source, output, durationSeconds, loopSource = false) {\n  await execFileAsync("ffmpeg", [\n    "-y",\n    ...(loopSource ? ["-stream_loop", "-1"] : []),\n    "-i", source,'
          )
          text = text.replace(
              '    "-vf", "scale=\'min(1280,iw)\':-2",',
              '    "-vf", "scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2:black",'
          )
          text = text.replace(
              '    if (sourceInfo.width < 1280 || sourceInfo.height < 720) throw new Error(`source below landscape HD ${sourceInfo.width}x${sourceInfo.height}`);\n    const minimumDuration = Number(item.min_duration_seconds || 8);\n    if (sourceInfo.duration + 0.05 < minimumDuration) throw new Error(`source shorter than ${minimumDuration}s`);\n    const requested = Math.min(\n      Number(item.output_duration_seconds || 10),\n      Number(sourceInfo.duration),\n      12,\n    );\n    await compact(source, output, requested);',
              '    if (sourceInfo.width < 960 || sourceInfo.height < 540) throw new Error(`source below usable landscape resolution ${sourceInfo.width}x${sourceInfo.height}`);\n    const minimumDuration = Number(item.min_duration_seconds || 8);\n    const requested = Math.min(Number(item.output_duration_seconds || 10), 12);\n    const loopSource = sourceInfo.duration + 0.05 < minimumDuration;\n    await compact(source, output, requested, loopSource);'
          )
          if 'force_original_aspect_ratio=decrease' not in text or 'loopSource' not in text:
              raise SystemExit('Selected Pexels script patch did not apply')
          script.write_text(text)

          manifest_path = Path('projects/004-the-ai-race-clean-rebuild/research/selected_pexels_manifest.json')
          manifest = json.loads(manifest_path.read_text())
          for asset in manifest['assets']:
              if asset['scene_id'] == 'scene_005':
                  asset['provider_asset_ids'] = ['34406409', '6803583']
          manifest['request_revision'] = int(manifest.get('request_revision', 1)) + 1
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n')

          for workflow_name in [
              '.github/workflows/orvyq-selected-pexels-acquisition.yml',
              '.github/workflows/orvyq-run-selected-pexels-project004.yml',
          ]:
              p = Path(workflow_name)
              wf = p.read_text()
              wf = wf.replace(
                  '            ffmpeg -y -ss 1 -i "$clip" -frames:v 1 -vf "scale=640:-2" "$OUT/${base}.jpg" >/dev/null 2>&1',
                  '            ffmpeg -y -ss 1 -i "$clip" -frames:v 1 -vf "scale=640:-2" "$OUT/${base}.jpg" >/dev/null 2>&1 || echo "::warning::Could not generate contact frame for $clip"'
              )
              p.write_text(wf)
          PY

      - name: Commit retry correction
        shell: bash
        run: |
          set -euo pipefail
          git add \
            scripts/orvyq_acquire_selected_pexels.mjs \
            projects/004-the-ai-race-clean-rebuild/research/selected_pexels_manifest.json \
            .github/workflows/orvyq-selected-pexels-acquisition.yml \
            .github/workflows/orvyq-run-selected-pexels-project004.yml
          git config user.name "orvyq-system-bot"
          git config user.email "orvyq-system-bot@users.noreply.github.com"
          git commit -m "Fix selected footage normalization and retry unresolved scenes"
          git push origin HEAD:agent/project-001-clean-rebuild

# retrigger 2026-08-02T02:19:37+03:00
