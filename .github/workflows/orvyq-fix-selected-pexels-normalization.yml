name: ORVYQ Fix Selected Pexels Normalization

on:
  push:
    branches:
      - "agent/project-001-clean-rebuild"
    paths:
      - ".github/workflows/orvyq-fix-selected-pexels-normalization.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/project-001-clean-rebuild
          fetch-depth: 2
      - name: Patch selected Pexels normalization
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/orvyq_acquire_selected_pexels.mjs')
          text = p.read_text()
          old_compact = '''async function compact(source, output, durationSeconds) {
  await execFileAsync("ffmpeg", [
    "-y",
    "-i", source,
    "-t", String(durationSeconds),
    "-vf", "scale='min(1280,iw)':-2",
    "-c:v", "libx264",
    "-preset", "medium",
    "-crf", "25",
    "-pix_fmt", "yuv420p",
    "-movflags", "+faststart",
    "-an",
    output,
  ], { maxBuffer: 24 * 1024 * 1024 });
}
'''
          new_compact = '''async function compact(source, output, durationSeconds, sourceDurationSeconds) {
  const shouldLoop = Number(sourceDurationSeconds || 0) + 0.05 < Number(durationSeconds || 0);
  const args = ["-y"];
  if (shouldLoop) args.push("-stream_loop", "-1");
  args.push(
    "-i", source,
    "-t", String(durationSeconds),
    "-vf", "scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2:black,setsar=1",
    "-c:v", "libx264",
    "-preset", "medium",
    "-crf", "25",
    "-pix_fmt", "yuv420p",
    "-movflags", "+faststart",
    "-an",
    output,
  );
  await execFileAsync("ffmpeg", args, { maxBuffer: 24 * 1024 * 1024 });
}
'''
          old_validation = '''    if (sourceInfo.width <= sourceInfo.height) throw new Error(`portrait/square source ${sourceInfo.width}x${sourceInfo.height}`);
    if (sourceInfo.width < 1280 || sourceInfo.height < 720) throw new Error(`source below landscape HD ${sourceInfo.width}x${sourceInfo.height}`);
    const minimumDuration = Number(item.min_duration_seconds || 8);
    if (sourceInfo.duration + 0.05 < minimumDuration) throw new Error(`source shorter than ${minimumDuration}s`);
    const requested = Math.min(
      Number(item.output_duration_seconds || 10),
      Number(sourceInfo.duration),
      12,
    );
    await compact(source, output, requested);
'''
          new_validation = '''    if (!(sourceInfo.width > 0 && sourceInfo.height > 0 && sourceInfo.duration > 0)) {
      throw new Error(`invalid source media ${sourceInfo.width}x${sourceInfo.height} duration=${sourceInfo.duration}`);
    }
    const minimumDuration = Number(item.min_duration_seconds || 8);
    const requested = Math.min(Math.max(Number(item.output_duration_seconds || 10), minimumDuration), 12);
    await compact(source, output, requested, sourceInfo.duration);
'''
          old_transform = '''      maximum_width: 1280,
      codec: "h264",
      crf: 25,
      audio_removed: true,
'''
          new_transform = '''      output_width: 1280,
      output_height: 720,
      fit: "contain_with_black_padding",
      short_source_policy: "controlled_loop_to_requested_duration",
      codec: "h264",
      crf: 25,
      audio_removed: true,
'''
          for old, new, label in [
            (old_compact, new_compact, 'compact function'),
            (old_validation, new_validation, 'source validation'),
            (old_transform, new_transform, 'provenance transform'),
          ]:
            if old in text:
              text = text.replace(old, new)
            elif new not in text:
              raise SystemExit(f'Could not find {label}')
          p.write_text(text)
          PY
      - name: Commit normalization correction
        shell: bash
        run: |
          set -euo pipefail
          git add scripts/orvyq_acquire_selected_pexels.mjs
          git config user.name "orvyq-system-bot"
          git config user.email "orvyq-system-bot@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "Normalization patch already applied."
            exit 0
          fi
          git commit -m "Normalize all selected footage to 1280x720"
          git pull --rebase origin agent/project-001-clean-rebuild
          git push origin HEAD:agent/project-001-clean-rebuild
