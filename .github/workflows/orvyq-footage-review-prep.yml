name: ORVYQ Footage Review Preparation

on:
  push:
    branches:
      - "agent/project-001-clean-rebuild"
    paths:
      - "projects/004-the-ai-race-clean-rebuild/config/footage_review_request.json"

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: orvyq-footage-review-prep-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PROJECT_ID: 004-the-ai-race-clean-rebuild
      TARGET_BRANCH: agent/project-001-clean-rebuild
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/project-001-clean-rebuild
          lfs: true
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies and media tooling
        run: |
          set -euo pipefail
          npm ci
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Confirm complete acquisition
        run: |
          set -euo pipefail
          RUNTIME="projects/$PROJECT_ID/assets/footage_acquisition.runtime.json"
          test "$(jq -r '.pass' "$RUNTIME")" = "true"
          test "$(jq '.records | length' "$RUNTIME")" -eq 20
          test "$(jq '.unresolved_scene_ids | length' "$RUNTIME")" -eq 0

      - name: Generate four-position semantic contact sheets
        shell: bash
        run: |
          set -euo pipefail
          ROOT="projects/$PROJECT_ID"
          RUNTIME="$ROOT/assets/footage_acquisition.runtime.json"
          OUT="$ROOT/qa/footage-contact-sheets"
          TMP="$ROOT/qa/.footage-contact-sheet-tmp"
          rm -rf "$OUT" "$TMP"
          mkdir -p "$OUT" "$TMP"
          jq -r '.records[].path' "$RUNTIME" | while IFS= read -r relative; do
            clip="$ROOT/$relative"
            base="$(basename "$clip" .mp4)"
            duration="$(ffprobe -nostdin -v error -show_entries format=duration -of default=nw=1:nk=1 "$clip")"
            read -r t1 t2 t3 t4 <<< "$(python3 - "$duration" <<'PY'
          import sys
          d = max(float(sys.argv[1]), 0.1)
          points = [
              min(0.5, max(0.0, d - 0.05)),
              max(0.0, min(d * 0.33, d - 0.05)),
              max(0.0, min(d * 0.66, d - 0.05)),
              max(0.0, d - 0.5),
          ]
          print(' '.join(f'{p:.3f}' for p in points))
          PY
          )"
            clip_tmp="$TMP/$base"
            mkdir -p "$clip_tmp"
            index=0
            for timestamp in "$t1" "$t2" "$t3" "$t4"; do
              index=$((index + 1))
              ffmpeg -nostdin -v error -y -ss "$timestamp" -i "$clip" \
                -frames:v 1 -vf "scale=480:270:force_original_aspect_ratio=decrease,pad=480:270:(ow-iw)/2:(oh-ih)/2:black,setsar=1" \
                "$clip_tmp/frame_${index}.jpg"
            done
            ffmpeg -nostdin -v error -y \
              -i "$clip_tmp/frame_1.jpg" -i "$clip_tmp/frame_2.jpg" \
              -i "$clip_tmp/frame_3.jpg" -i "$clip_tmp/frame_4.jpg" \
              -filter_complex "[0:v][1:v]hstack=inputs=2[top];[2:v][3:v]hstack=inputs=2[bottom];[top][bottom]vstack=inputs=2[sheet]" \
              -map "[sheet]" -frames:v 1 "$OUT/${base}.jpg"
          done
          rm -rf "$TMP"
          test "$(find "$OUT" -type f -name '*.jpg' | wc -l)" -eq 20

      - name: Build byte-bound review queue
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import crypto from 'node:crypto';
          import path from 'node:path';
          import { promises as fs } from 'node:fs';
          const projectId = process.env.PROJECT_ID;
          const root = path.join('projects', projectId);
          const runtime = JSON.parse(await fs.readFile(path.join(root, 'assets', 'footage_acquisition.runtime.json'), 'utf8'));
          const manifest = JSON.parse(await fs.readFile(path.join(root, 'research', 'selected_pexels_manifest.json'), 'utf8'));
          const motionHook = JSON.parse(await fs.readFile(path.join(root, 'direction', 'motion_hook.json'), 'utf8'));
          const byScene = new Map(manifest.assets.map((item) => [item.scene_id, item]));
          const hookUsesByScene = new Map();
          for (const hookShot of motionHook.shots || []) {
            const list = hookUsesByScene.get(hookShot.scene_id) || [];
            list.push({
              claim_id: hookShot.claim_id,
              narration_anchor: hookShot.narration_anchor,
              semantic_rationale: hookShot.semantic_rationale || `Use ${hookShot.scene_id} as a brief opening image that gives the stated race-and-governance narration a concrete physical context without treating generic stock as proof.`,
              semantic_link: hookShot.semantic_link || 'physical'
            });
            hookUsesByScene.set(hookShot.scene_id, list);
          }
          const digest = (buffer) => crypto.createHash('sha256').update(buffer).digest('hex');
          const entries = [];
          for (const record of runtime.records) {
            const planned = byScene.get(record.scene_id);
            if (!planned) throw new Error(`${record.scene_id}: selected manifest entry is missing`);
            const assetPath = path.join(root, record.path);
            const assetBuffer = await fs.readFile(assetPath);
            const actualAssetSha = digest(assetBuffer);
            const provenancePath = path.join(root, `${record.path}.provenance.json`);
            const provenance = JSON.parse(await fs.readFile(provenancePath, 'utf8'));
            const provenanceSha = String(provenance.actual_sha256 || provenance.sha256 || '').toLowerCase();
            if (actualAssetSha !== provenanceSha) throw new Error(`${record.scene_id}: footage bytes do not match provenance`);
            const contactSheetPath = `qa/footage-contact-sheets/${path.basename(record.path, '.mp4')}.jpg`;
            const sheetBuffer = await fs.readFile(path.join(root, contactSheetPath));
            const approvedUses = [{
              claim_id: record.claim_id,
              narration_anchor: planned.narration_anchor,
              semantic_rationale: planned.semantic_rationale,
              semantic_link: planned.semantic_link || 'physical'
            }, ...(hookUsesByScene.get(record.scene_id) || [])];
            const uniqueUses = [];
            const seen = new Set();
            for (const use of approvedUses) {
              const key = `${use.claim_id}\u0000${use.narration_anchor}`;
              if (seen.has(key)) continue;
              seen.add(key);
              uniqueUses.push(use);
            }
            entries.push({
              scene_id: record.scene_id,
              provider_asset_id: String(record.provider_asset_id),
              status: 'pending_visual_review',
              asset_path: record.path,
              asset_sha256: actualAssetSha,
              contact_sheet_path: contactSheetPath,
              contact_sheet_sha256: digest(sheetBuffer),
              duration_seconds: provenance.actual_duration_seconds || provenance.duration,
              transformation: provenance.transformation || null,
              sampled_positions: ['opening', 'one_third', 'two_thirds', 'near_end'],
              approved_uses_if_visually_valid: uniqueUses,
              review_blockers: []
            });
          }
          entries.sort((a, b) => a.scene_id.localeCompare(b.scene_id));
          if (entries.length !== 20) throw new Error(`Expected 20 review entries, found ${entries.length}`);
          await fs.writeFile(path.join(root, 'qa', 'footage_review_queue.json'), JSON.stringify({
            schema_version: '1.2-four-position',
            project_id: projectId,
            generated_at: new Date().toISOString(),
            review_method: 'four-position claim-specific contact-sheet review',
            pending_review_count: entries.length,
            entries_with_exact_uses: entries.filter((entry) => entry.approved_uses_if_visually_valid.length > 0).length,
            entries
          }, null, 2) + '\n');
          NODE

      - name: Validate render-free review readiness inputs
        run: node scripts/orvyq_review_readiness_audit.mjs --project-id="$PROJECT_ID" --check-only

      - name: Upload semantic review package
        uses: actions/upload-artifact@v4
        with:
          name: orvyq-footage-review-${{ env.PROJECT_ID }}-${{ github.run_id }}
          retention-days: 30
          path: |
            projects/${{ env.PROJECT_ID }}/qa/footage-contact-sheets/**
            projects/${{ env.PROJECT_ID }}/qa/footage_review_queue.json
            projects/${{ env.PROJECT_ID }}/research/selected_pexels_manifest.json
            projects/${{ env.PROJECT_ID }}/direction/motion_hook.json
          if-no-files-found: error

      - name: Commit review package
        run: |
          set -euo pipefail
          git config user.name "orvyq-footage-review-bot"
          git config user.email "orvyq-footage-review-bot@users.noreply.github.com"
          git add -f \
            "projects/$PROJECT_ID/qa/footage-contact-sheets" \
            "projects/$PROJECT_ID/qa/footage_review_queue.json"
          if git diff --cached --quiet; then
            echo "No review-package changes"
            exit 0
          fi
          git commit -m "Prepare multiframe footage review for $PROJECT_ID"
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"

      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          BODY="Project 004 four-position footage review preparation finished with **${JOB_STATUS}**. Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. No video render was started."
          gh api "repos/$GITHUB_REPOSITORY/issues/5/comments" -f body="$BODY" || true
