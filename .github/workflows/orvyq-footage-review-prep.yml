name: ORVYQ Footage Review Preparation

on:
  push:
    branches:
      - "agent/project-001-clean-rebuild"
    paths:
      - "projects/004-the-ai-race-clean-rebuild/config/footage_review_request.json"

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: orvyq-footage-review-prep-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PROJECT_ID: 004-the-ai-race-clean-rebuild
      TARGET_BRANCH: agent/project-001-clean-rebuild
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/project-001-clean-rebuild
          lfs: true
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies and media tooling
        run: |
          set -euo pipefail
          npm ci
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Prepare byte-bound four-position review package
        run: node scripts/orvyq_prepare_footage_review.mjs --project-id="$PROJECT_ID"

      - name: Validate render-free review readiness inputs
        run: node scripts/orvyq_review_readiness_audit.mjs --project-id="$PROJECT_ID" --check-only

      - name: Upload semantic review package
        uses: actions/upload-artifact@v4
        with:
          name: orvyq-footage-review-${{ env.PROJECT_ID }}-${{ github.run_id }}
          retention-days: 30
          path: |
            projects/${{ env.PROJECT_ID }}/qa/footage-contact-sheets/**
            projects/${{ env.PROJECT_ID }}/qa/footage_review_queue.json
            projects/${{ env.PROJECT_ID }}/research/selected_pexels_manifest.json
            projects/${{ env.PROJECT_ID }}/direction/motion_hook.json
          if-no-files-found: error

      - name: Commit review package
        run: |
          set -euo pipefail
          git config user.name "orvyq-footage-review-bot"
          git config user.email "orvyq-footage-review-bot@users.noreply.github.com"
          git add -f \
            "projects/$PROJECT_ID/qa/footage-contact-sheets" \
            "projects/$PROJECT_ID/qa/footage_review_queue.json"
          if git diff --cached --quiet; then
            echo "No review-package changes"
            exit 0
          fi
          git commit -m "Prepare multiframe footage review for $PROJECT_ID"
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"

      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          BODY="Project 004 four-position footage review preparation finished with **${JOB_STATUS}**. Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. No video render was started."
          gh api "repos/$GITHUB_REPOSITORY/issues/5/comments" -f body="$BODY" || true
