name: ORVYQ Sync Reviewed Footage Plan

on:
  push:
    branches:
      - "agent/project-001-clean-rebuild"
    paths:
      - ".github/workflows/orvyq-sync-reviewed-footage-plan.yml"

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: orvyq-sync-reviewed-footage-plan-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROJECT_ID: 004-the-ai-race-clean-rebuild
      TARGET_BRANCH: agent/project-001-clean-rebuild
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/project-001-clean-rebuild
          lfs: true
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Synchronize reviewed footage into every planning surface
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import path from 'node:path';
          import { promises as fs } from 'node:fs';

          const projectId = process.env.PROJECT_ID;
          const root = path.join('projects', projectId);
          const readJson = async (relative) => JSON.parse(await fs.readFile(path.join(root, relative), 'utf8'));
          const writeJson = async (relative, value) => fs.writeFile(path.join(root, relative), JSON.stringify(value, null, 2) + '\n');

          const queue = await readJson('qa/footage_review_queue.json');
          const reviews = await readJson('research/visual_asset_reviews.json');
          const existingContracts = await readJson('research/footage_use_contracts.json');
          const existingRequests = await readJson('research/visual_asset_requests.json');
          const existingPlan = await readJson('config/editorial_asset_plan.json');
          const existingDecisions = await readJson('config/footage_review_decisions.json');
          const blueprint = await readJson('direction/editorial_blueprint.json');

          if (queue.project_id !== projectId || reviews.project_id !== projectId) {
            throw new Error('Project identity mismatch in footage review inputs');
          }
          if (!Array.isArray(queue.entries) || queue.entries.length !== 41) {
            throw new Error(`Expected 41 queue entries, found ${queue.entries?.length ?? 0}`);
          }
          if (reviews.summary?.approved !== 41 || reviews.summary?.pending_frame_review !== 0 || reviews.summary?.rejected_from_metadata !== 6) {
            throw new Error(`Visual review is not final: ${JSON.stringify(reviews.summary || {})}`);
          }
          if (!Array.isArray(reviews.approved_assets) || reviews.approved_assets.length !== 41) {
            throw new Error('Expected exactly 41 approved visual-review records');
          }

          const approvedByScene = new Map(reviews.approved_assets.map((item) => [item.scene_id, item]));
          const expectedScenes = Array.from({ length: 41 }, (_, index) => `scene_${String(index + 1).padStart(3, '0')}`);
          const actualScenes = queue.entries.map((entry) => entry.scene_id);
          if (JSON.stringify(actualScenes) !== JSON.stringify(expectedScenes)) {
            throw new Error(`Queue is not the exact ordered 41-scene package: ${actualScenes.join(',')}`);
          }

          const normalized = queue.entries.map((entry) => {
            const approved = approvedByScene.get(entry.scene_id);
            if (!approved) throw new Error(`${entry.scene_id}: missing approved review record`);
            if (String(approved.provider_asset_id) !== String(entry.provider_asset_id)) {
              throw new Error(`${entry.scene_id}: provider identity mismatch`);
            }
            if (String(approved.asset_sha256).toLowerCase() !== String(entry.asset_sha256).toLowerCase()) {
              throw new Error(`${entry.scene_id}: footage SHA-256 mismatch`);
            }
            if (String(approved.contact_sheet_sha256).toLowerCase() !== String(entry.contact_sheet_sha256).toLowerCase()) {
              throw new Error(`${entry.scene_id}: contact-sheet SHA-256 mismatch`);
            }
            if (!Array.isArray(approved.approved_uses) || approved.approved_uses.length < 1) {
              throw new Error(`${entry.scene_id}: missing claim-bound approved use`);
            }
            for (const approvedUse of approved.approved_uses) {
              if (!approvedUse.claim_id || !approvedUse.narration_anchor || !approvedUse.semantic_rationale) {
                throw new Error(`${entry.scene_id}: incomplete claim-bound approved use`);
              }
            }
            const primaryUse = approved.approved_uses[0];
            return { entry, approved, primaryUse, approvedUses: approved.approved_uses };
          });

          const expectedClaims = Array.from({ length: 21 }, (_, index) => `CLM_${String(index + 1).padStart(3, '0')}`);
          const byClaim = new Map(expectedClaims.map((claimId) => [claimId, []]));
          for (const item of normalized) {
            const bucket = byClaim.get(item.primaryUse.claim_id);
            if (!bucket) throw new Error(`${item.entry.scene_id}: unexpected primary claim ${item.primaryUse.claim_id}`);
            bucket.push(item);
          }
          for (const [claimId, items] of byClaim) {
            items.sort((a, b) => a.entry.scene_id.localeCompare(b.entry.scene_id));
            if (items.length < 1 || items.length > 2) {
              throw new Error(`${claimId}: expected one or two primary footage assets, found ${items.length}`);
            }
          }
          const singletonClaims = [...byClaim].filter(([, items]) => items.length === 1).map(([claimId]) => claimId);
          if (singletonClaims.length !== 1) {
            throw new Error(`Expected exactly one single-footage primary claim, found ${singletonClaims.join(',')}`);
          }

          const assignments = [];
          const contracts = [];
          const requests = [];
          const decisions = [];
          const approvedPool = [];
          const firstAssignmentByClaim = new Map();

          for (const claimId of expectedClaims) {
            const items = byClaim.get(claimId);
            items.forEach((item, sliceIndex) => {
              const { entry, approved, primaryUse, approvedUses } = item;
              const assetId = `local-footage-${entry.scene_id}`;
              const assignment = {
                claim_id: claimId,
                slice_index: sliceIndex,
                slice_span: 1,
                asset_path: entry.asset_path,
                asset_id: assetId,
                source_start_seconds: 0
              };
              assignments.push(assignment);
              if (sliceIndex === 0) firstAssignmentByClaim.set(claimId, assignment);

              approvedPool.push({
                asset_id: assetId,
                asset_path: entry.asset_path,
                status: 'authentic_approved',
                source_type: 'pexels_footage',
                license_scope: 'Pexels licensed footage with repository-local source and byte-bound review provenance',
                claim_id: claimId,
                narration_anchor: primaryUse.narration_anchor,
                semantic_rationale: primaryUse.semantic_rationale,
                approved_uses: approvedUses,
                provider_asset_id: String(entry.provider_asset_id),
                asset_sha256: entry.asset_sha256,
                contact_sheet_path: entry.contact_sheet_path,
                contact_sheet_sha256: entry.contact_sheet_sha256,
                review_method: approved.review_method
              });

              contracts.push({
                assignment_id: `assignment_${entry.scene_id}`,
                narration_anchor: primaryUse.narration_anchor,
                claim_id: claimId,
                asset_path: entry.asset_path,
                asset_sha256: entry.asset_sha256,
                semantic_link: primaryUse.semantic_link || 'physical',
                semantic_rationale: primaryUse.semantic_rationale,
                approved_uses: approvedUses,
                review_method: approved.review_method,
                contact_sheet_path: entry.contact_sheet_path,
                contact_sheet_sha256: entry.contact_sheet_sha256,
                minimum_source_duration_seconds: Math.min(6, Number(entry.duration_seconds || 6)),
                status: 'approved_for_edit'
              });

              requests.push({
                request_id: `footage_${entry.scene_id}`,
                type: 'footage',
                claim_ids: [...new Set(approvedUses.map((use) => use.claim_id))],
                intended_use: approvedUses.map((use) => use.semantic_rationale).join(' '),
                required_semantics: approvedUses.map((use) => use.narration_anchor).join(' / '),
                approved_uses: approvedUses,
                status: 'approved_for_edit',
                asset_path: entry.asset_path,
                provider_asset_id: String(entry.provider_asset_id),
                asset_sha256: entry.asset_sha256,
                contact_sheet_path: entry.contact_sheet_path,
                contact_sheet_sha256: entry.contact_sheet_sha256
              });

              decisions.push({
                scene_id: entry.scene_id,
                provider_asset_id: String(entry.provider_asset_id),
                asset_path: entry.asset_path,
                asset_sha256: entry.asset_sha256,
                contact_sheet_path: entry.contact_sheet_path,
                contact_sheet_sha256: entry.contact_sheet_sha256,
                decision: 'approved',
                decision_rationale: approved.decision_rationale,
                approved_uses: approvedUses,
                reviewed_at: approved.reviewed_at || reviews.completed_at
              });
            });
          }

          if (assignments.length !== 41 || approvedPool.length !== 41 || contracts.length !== 41 || requests.length !== 41 || decisions.length !== 41) {
            throw new Error('Generated planning surfaces are not all exactly 41 entries');
          }

          const editorialPlan = {
            ...existingPlan,
            schema_version: existingPlan.schema_version || '1.0',
            project_id: projectId,
            approved_pool: approvedPool,
            candidate_assets: [],
            assignments,
            notes: 'Synchronized from the exact current 41-of-41 four-position manual visual review. Each asset is assigned by its primary approved use; additional claim-specific approved uses remain preserved in the review, request and contract records. No rejected predecessor path is retained.'
          };

          const footageContracts = {
            ...existingContracts,
            schema_version: existingContracts.schema_version || '1.0',
            project_id: projectId,
            review_method: queue.review_method,
            global_rejected_asset_reentry_forbidden: true,
            assignments: contracts,
            explicit_retirements: existingContracts.explicit_retirements || [],
            pending_scene_replacement_required: []
          };

          const visualRequests = {
            ...existingRequests,
            schema_version: existingRequests.schema_version || '1.0',
            project_id: projectId,
            requests
          };

          const footageDecisions = {
            ...existingDecisions,
            schema_version: existingDecisions.schema_version || '1.0',
            round_id: '004-footage-review-round-current-41',
            project_id: projectId,
            review_method: queue.review_method,
            submitted_at: reviews.completed_at || new Date().toISOString(),
            reviewed_by: 'orvyq_manual_four_position_review',
            decisions
          };

          blueprint.motion_hooks = (blueprint.motion_hooks || []).map((hook) => {
            const assignment = firstAssignmentByClaim.get(hook.claim_id);
            if (!assignment) return hook;
            const isFootageHook = hook.visual_role === 'cinematic_body_footage' || hook.asset_type === 'footage';
            if (!isFootageHook) return hook;
            return {
              ...hook,
              asset_id: assignment.asset_id,
              asset_path: assignment.asset_path,
              source_start_seconds: assignment.source_start_seconds
            };
          });

          await writeJson('config/editorial_asset_plan.json', editorialPlan);
          await writeJson('research/footage_use_contracts.json', footageContracts);
          await writeJson('research/visual_asset_requests.json', visualRequests);
          await writeJson('config/footage_review_decisions.json', footageDecisions);
          await writeJson('direction/editorial_blueprint.json', blueprint);

          console.log(JSON.stringify({
            project_id: projectId,
            approved_pool: approvedPool.length,
            assignments: assignments.length,
            contracts: contracts.length,
            requests: requests.length,
            decisions: decisions.length,
            singleton_primary_claim: singletonClaims[0]
          }, null, 2));
          NODE

      - name: Apply canonical review decisions and reconcile planning data
        shell: bash
        run: |
          set -euo pipefail
          node scripts/orvyq_apply_footage_review_decisions.mjs --project-id="$PROJECT_ID" | tee footage-plan-sync.log
          jq -e '.summary.approved == 41 and .summary.pending_frame_review == 0 and .summary.rejected_from_metadata == 6 and (.approved_assets | length) == 41' "projects/$PROJECT_ID/research/visual_asset_reviews.json"
          jq -e '(.approved_pool | length) == 41 and (.assignments | length) == 41 and (.candidate_assets | length) == 0' "projects/$PROJECT_ID/config/editorial_asset_plan.json"
          jq -e '(.assignments | length) == 41 and (.pending_scene_replacement_required | length) == 0' "projects/$PROJECT_ID/research/footage_use_contracts.json"
          jq -e '(.requests | length) == 41 and ([.requests[].status] | all(. == "approved_for_edit"))' "projects/$PROJECT_ID/research/visual_asset_requests.json"
          jq -e '(.decisions | length) == 41 and ([.decisions[].decision] | all(. == "approved"))' "projects/$PROJECT_ID/config/footage_review_decisions.json"

      - name: Reject stale predecessor paths everywhere
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E 'scene_008_5377280|scene_019_992599' \
            "projects/$PROJECT_ID/config/editorial_asset_plan.json" \
            "projects/$PROJECT_ID/config/footage_review_decisions.json" \
            "projects/$PROJECT_ID/research/footage_use_contracts.json" \
            "projects/$PROJECT_ID/research/visual_asset_requests.json" \
            "projects/$PROJECT_ID/direction/editorial_blueprint.json"; then
            echo "::error::A rejected predecessor footage path remains in active planning data"
            exit 1
          fi

      - name: Validate schemas and unit tests
        shell: bash
        run: |
          set -euo pipefail
          npm run validate:schemas
          npm test

      - name: Commit and push synchronized planning data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "orvyq-footage-planning-bot"
          git config user.email "orvyq-footage-planning-bot@users.noreply.github.com"
          git add \
            "projects/$PROJECT_ID/config/editorial_asset_plan.json" \
            "projects/$PROJECT_ID/config/footage_review_decisions.json" \
            "projects/$PROJECT_ID/research/footage_use_contracts.json" \
            "projects/$PROJECT_ID/research/visual_asset_requests.json" \
            "projects/$PROJECT_ID/research/visual_asset_reviews.json" \
            "projects/$PROJECT_ID/direction/editorial_blueprint.json"
          if git diff --cached --quiet; then
            echo "Reviewed footage planning data is already synchronized"
            exit 0
          fi
          git commit -m "Synchronize 41 reviewed footage assets with production plan"
          for attempt in 1 2 3; do
            if git pull --rebase origin "$TARGET_BRANCH" && git push origin "HEAD:$TARGET_BRANCH"; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 3))
          done
          echo "::error::Could not publish synchronized footage planning data"
          exit 1

      - name: Report synchronization result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          BODY="Reviewed-footage planning synchronization finished with **${JOB_STATUS}**. The exact 41 approved footage assets were propagated into the editorial plan, use contracts, visual requests, review decisions and motion-hook blueprint; rejected predecessor paths were forbidden. Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. No video render was started."
          gh api "repos/$GITHUB_REPOSITORY/issues/5/comments" -f body="$BODY" || true
