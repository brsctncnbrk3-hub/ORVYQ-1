name: ORVYQ Sync Reviewed Footage Plan

on:
  push:
    branches:
      - "agent/project-001-clean-rebuild"
    paths:
      - ".github/workflows/orvyq-sync-reviewed-footage-plan.yml"

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: orvyq-sync-reviewed-footage-plan-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PROJECT_ID: 004-the-ai-race-clean-rebuild
      TARGET_BRANCH: agent/project-001-clean-rebuild
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/project-001-clean-rebuild
          lfs: true
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate canonical 41-scene contracts and decisions
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import path from 'node:path';
          import { promises as fs } from 'node:fs';

          const projectId = process.env.PROJECT_ID;
          const root = path.join('projects', projectId);
          const readJson = async (relative) => JSON.parse(await fs.readFile(path.join(root, relative), 'utf8'));
          const writeJson = async (relative, value) => fs.writeFile(path.join(root, relative), JSON.stringify(value, null, 2) + '\n');

          const queue = await readJson('qa/footage_review_queue.json');
          const reviews = await readJson('research/visual_asset_reviews.json');
          const existingContracts = await readJson('research/footage_use_contracts.json');
          const editorial = await readJson('config/editorial_asset_plan.json');

          if (queue.project_id !== projectId || reviews.project_id !== projectId) throw new Error('Project identity mismatch');
          if (!Array.isArray(queue.entries) || queue.entries.length !== 41) throw new Error(`Expected 41 queue entries, found ${queue.entries?.length || 0}`);
          if (reviews.summary?.approved !== 41 || reviews.summary?.pending_frame_review !== 0 || reviews.summary?.rejected_from_metadata !== 6) {
            throw new Error(`Visual review is not final: ${JSON.stringify(reviews.summary || {})}`);
          }
          if (!Array.isArray(reviews.approved_assets) || reviews.approved_assets.length !== 41) throw new Error('Expected 41 approved review records');

          const approvedByScene = new Map(reviews.approved_assets.map((item) => [item.scene_id, item]));
          const expectedScenes = Array.from({ length: 41 }, (_, index) => `scene_${String(index + 1).padStart(3, '0')}`);
          const actualScenes = queue.entries.map((entry) => entry.scene_id);
          if (JSON.stringify(actualScenes) !== JSON.stringify(expectedScenes)) throw new Error(`Unexpected scene order: ${actualScenes.join(',')}`);

          const claimNumber = (claimId) => {
            const match = String(claimId || '').match(/^CLM_(\d{3})_/i);
            return match ? Number(match[1]) : Number.NaN;
          };
          const byPrimaryClaim = new Map();
          const normalized = queue.entries.map((entry) => {
            const approved = approvedByScene.get(entry.scene_id);
            if (!approved) throw new Error(`${entry.scene_id}: missing approved review record`);
            if (String(approved.provider_asset_id) !== String(entry.provider_asset_id)) throw new Error(`${entry.scene_id}: provider mismatch`);
            if (String(approved.asset_sha256).toLowerCase() !== String(entry.asset_sha256).toLowerCase()) throw new Error(`${entry.scene_id}: footage hash mismatch`);
            if (String(approved.contact_sheet_sha256).toLowerCase() !== String(entry.contact_sheet_sha256).toLowerCase()) throw new Error(`${entry.scene_id}: contact-sheet hash mismatch`);
            if (!Array.isArray(entry.approved_uses_if_visually_valid) || entry.approved_uses_if_visually_valid.length < 1) {
              throw new Error(`${entry.scene_id}: missing queue-approved use`);
            }
            const primaryUse = entry.approved_uses_if_visually_valid[0];
            if (!primaryUse.claim_id || !primaryUse.narration_anchor || String(primaryUse.semantic_rationale || '').length < 24) {
              throw new Error(`${entry.scene_id}: incomplete primary approved use`);
            }
            const number = claimNumber(primaryUse.claim_id);
            if (!Number.isInteger(number) || number < 1 || number > 21) {
              throw new Error(`${entry.scene_id}: malformed primary claim id ${primaryUse.claim_id}`);
            }
            const item = { entry, approved, primaryUse };
            byPrimaryClaim.set(primaryUse.claim_id, [...(byPrimaryClaim.get(primaryUse.claim_id) || []), item]);
            return item;
          });

          const primaryClaimIds = [...byPrimaryClaim.keys()].sort((a, b) => claimNumber(a) - claimNumber(b));
          const primaryClaimNumbers = primaryClaimIds.map(claimNumber);
          const expectedClaimNumbers = Array.from({ length: 21 }, (_, index) => index + 1);
          if (JSON.stringify(primaryClaimNumbers) !== JSON.stringify(expectedClaimNumbers)) {
            throw new Error(`Expected exact claim numbers 1-21, found ${primaryClaimIds.join(',')}`);
          }
          for (const claimId of primaryClaimIds) {
            const items = byPrimaryClaim.get(claimId);
            items.sort((a, b) => a.entry.scene_id.localeCompare(b.entry.scene_id));
            if (items.length < 1 || items.length > 3) throw new Error(`${claimId}: expected 1-3 primary footage assets, found ${items.length}`);
          }
          if ([...byPrimaryClaim.values()].reduce((sum, items) => sum + items.length, 0) !== 41) throw new Error('Primary claim grouping lost footage records');

          const motions = ['hold', 'push', 'pull', 'drift_left'];
          const contracts = [];
          for (const claimId of primaryClaimIds) {
            const items = byPrimaryClaim.get(claimId);
            items.forEach((item, sliceIndex) => {
              const sceneNumber = Number(item.entry.scene_id.split('_')[1]);
              const semanticLink = item.primaryUse.semantic_link || 'physical';
              const rationale = item.primaryUse.semantic_rationale;
              const humanContext = /people|person|human|worker|team|developer|researcher|laboratory|analyst|firm/i.test(rationale);
              contracts.push({
                scene_id: item.entry.scene_id,
                claim_id: claimId,
                slice_index: sliceIndex,
                trim_in_ratio: sceneNumber % 2 === 0 ? 0.18 : 0.08,
                motion: motions[(sceneNumber - 1) % motions.length],
                role: semanticLink === 'conceptual' ? 'governance_context' : (humanContext ? 'human_context' : 'context'),
                semantic_link: semanticLink,
                semantic_rationale: rationale
              });
            });
          }

          const decisions = normalized.map(({ entry, approved }) => ({
            scene_id: entry.scene_id,
            decision: 'approve',
            asset_sha256: entry.asset_sha256,
            contact_sheet_sha256: entry.contact_sheet_sha256,
            rationale: approved.decision_rationale
          }));

          if (contracts.length !== 41 || decisions.length !== 41) throw new Error('Canonical contract or decision count is not 41');
          if (decisions.some((decision) => String(decision.rationale || '').length < 24)) throw new Error('At least one approval rationale is too short');

          const contractDocument = {
            schema_version: existingContracts.schema_version || '1.0',
            project_id: projectId,
            policy: existingContracts.policy || 'Every scene is claim-bound. Generic footage cannot migrate to another claim, and no prior-project asset may be reused.',
            managed_scene_ids: expectedScenes,
            pruned_scene_ids: [],
            assignments: contracts
          };
          const decisionDocument = {
            schema_version: '1.0',
            project_id: projectId,
            reviewed_at: reviews.completed_at || new Date().toISOString(),
            review_method: queue.review_method || 'four-position claim-specific contact-sheet review',
            decisions
          };

          delete editorial.approved_pool;
          delete editorial.candidate_assets;
          delete editorial.assignments;
          await writeJson('research/footage_use_contracts.json', contractDocument);
          await writeJson('config/footage_review_decisions.json', decisionDocument);
          await writeJson('config/editorial_asset_plan.json', editorial);

          console.log(JSON.stringify({
            project_id: projectId,
            contracts: contracts.length,
            decisions: decisions.length,
            claims: primaryClaimIds.length,
            per_claim_counts: Object.fromEntries(primaryClaimIds.map((claimId) => [claimId, byPrimaryClaim.get(claimId).length]))
          }, null, 2));
          NODE

      - name: Apply canonical review decisions
        shell: bash
        run: |
          set -euo pipefail
          node scripts/orvyq_apply_footage_review_decisions.mjs --project-id="$PROJECT_ID" | tee footage-plan-sync.log

      - name: Synchronize footage motion hooks in the editorial blueprint
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import path from 'node:path';
          import { promises as fs } from 'node:fs';
          const root = path.join('projects', process.env.PROJECT_ID);
          const readJson = async (relative) => JSON.parse(await fs.readFile(path.join(root, relative), 'utf8'));
          const writeJson = async (relative, value) => fs.writeFile(path.join(root, relative), JSON.stringify(value, null, 2) + '\n');
          const [blueprint, contracts, runtime] = await Promise.all([
            readJson('direction/editorial_blueprint.json'),
            readJson('research/footage_use_contracts.json'),
            readJson('assets/footage_acquisition.runtime.json')
          ]);
          const recordByScene = new Map((runtime.records || []).map((record) => [record.scene_id, record]));
          const contractsByClaim = new Map();
          for (const contract of contracts.assignments || []) {
            contractsByClaim.set(contract.claim_id, [...(contractsByClaim.get(contract.claim_id) || []), contract]);
          }
          for (const items of contractsByClaim.values()) items.sort((a, b) => Number(a.slice_index) - Number(b.slice_index));
          blueprint.motion_hooks = (blueprint.motion_hooks || []).map((hook) => {
            const isFootageHook = hook.visual_role === 'cinematic_body_footage' || hook.asset_type === 'footage';
            if (!isFootageHook) return hook;
            const choices = contractsByClaim.get(hook.claim_id) || [];
            const contract = choices.find((item) => Number(item.slice_index) === Number(hook.slice_index || 0)) || choices[0];
            if (!contract) return hook;
            const record = recordByScene.get(contract.scene_id);
            if (!record) throw new Error(`${contract.scene_id}: blueprint synchronization has no runtime record`);
            return {
              ...hook,
              asset_id: `local-footage-${contract.scene_id}`,
              asset_path: record.path,
              source_start_seconds: 0,
              semantic_rationale: contract.semantic_rationale,
              semantic_link: contract.semantic_link
            };
          });
          await writeJson('direction/editorial_blueprint.json', blueprint);
          NODE

      - name: Verify canonical synchronized state
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.summary.approved == 41 and .summary.pending_frame_review == 0 and .summary.rejected_from_metadata == 6 and (.approved_assets | length) == 41' "projects/$PROJECT_ID/research/visual_asset_reviews.json"
          jq -e '(.assignments | length) == 41 and (.managed_scene_ids | length) == 41' "projects/$PROJECT_ID/research/footage_use_contracts.json"
          jq -e '(.decisions | length) == 41 and ([.decisions[].decision] | all(. == "approve"))' "projects/$PROJECT_ID/config/footage_review_decisions.json"
          jq -e '.status == "ready" and (.full_footage_pool | length) == 41 and ([.footage_assignments | to_entries[] | .value | to_entries[]] | length) == 41' "projects/$PROJECT_ID/config/editorial_asset_plan.json"
          jq -e '([.requests[] | select(.type == "contextual_footage")] | length) == 41 and ([.requests[] | select(.type == "contextual_footage") | .status] | all(. == "ready"))' "projects/$PROJECT_ID/research/visual_asset_requests.json"
          jq -e '.status == "ready" and (.shots | length) == 4' "projects/$PROJECT_ID/direction/motion_hook.json"
          jq -e '.current_stage == "render_free_candidate_validation_ready" and .render_authorized == false' "projects/$PROJECT_ID/project.json"
          jq -e '.status == "ready_for_candidate_validation"' "projects/$PROJECT_ID/config/production_profile.json"
          test "$(find "projects/$PROJECT_ID/assets/footage" -maxdepth 1 -type f -name '*.mp4.provenance.json' | wc -l)" -eq 41
          if grep -R -n -E 'scene_008_5377280|scene_019_992599' \
            "projects/$PROJECT_ID/config/editorial_asset_plan.json" \
            "projects/$PROJECT_ID/research/visual_asset_requests.json" \
            "projects/$PROJECT_ID/direction/motion_hook.json" \
            "projects/$PROJECT_ID/direction/editorial_blueprint.json"; then
            echo "::error::A rejected predecessor footage path remains in active planning data"
            exit 1
          fi

      - name: Validate schemas and unit tests
        shell: bash
        run: |
          set -euo pipefail
          npm run validate:schemas
          npm test

      - name: Commit and push synchronized planning data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "orvyq-footage-planning-bot"
          git config user.email "orvyq-footage-planning-bot@users.noreply.github.com"
          git add \
            "projects/$PROJECT_ID/config/footage_review_decisions.json" \
            "projects/$PROJECT_ID/config/editorial_asset_plan.json" \
            "projects/$PROJECT_ID/config/production_profile.json" \
            "projects/$PROJECT_ID/research/footage_use_contracts.json" \
            "projects/$PROJECT_ID/research/visual_asset_requests.json" \
            "projects/$PROJECT_ID/research/visual_asset_reviews.json" \
            "projects/$PROJECT_ID/direction/motion_hook.json" \
            "projects/$PROJECT_ID/direction/editorial_blueprint.json" \
            "projects/$PROJECT_ID/direction/visual_rebalance_plan.json" \
            "projects/$PROJECT_ID/project.json"
          git add -f "projects/$PROJECT_ID/assets/footage"/*.mp4.provenance.json
          if git diff --cached --quiet; then
            echo "Reviewed footage planning data is already synchronized"
            exit 0
          fi
          git commit -m "Synchronize 41 reviewed footage assets with production plan"
          for attempt in 1 2 3; do
            if git pull --rebase origin "$TARGET_BRANCH" && git push origin "HEAD:$TARGET_BRANCH"; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 3))
          done
          echo "::error::Could not publish synchronized footage planning data"
          exit 1

      - name: Report synchronization result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          BODY="Reviewed-footage planning synchronization finished with **${JOB_STATUS}**. The canonical review applicator verified exact media and contact-sheet bytes, promoted all 41 claim-bound contracts, rebuilt the editorial footage assignments and removed rejected predecessor paths. Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. No video render was started."
          gh api "repos/$GITHUB_REPOSITORY/issues/5/comments" -f body="$BODY" || true
