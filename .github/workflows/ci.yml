name: ORVYQ CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install root dependencies
        run: npm ci

      # Temporary: with the ntia.gov TLS fix landed, Candidate Validation
      # run 30895095034 progressed to a new, different evidence-fetch
      # failure -- EVID_EU_INCIDENT_REPORTING (eur-lex.europa.eu) downloaded
      # 0 bytes, using the new nodeHttpsFetch implementation in
      # scripts/orvyq_fetch_primary_evidence.mjs. This never failed before
      # that rewrite, so it's most likely a real bug in the new fetch code
      # (e.g. compression/redirect handling), not a new host-side problem.
      # Compare curl (known-good baseline) against the actual nodeHttpsFetch
      # code path against the real URL to isolate it. Remove once decided.
      - name: Diagnose EVID_EU_INCIDENT_REPORTING 0-byte download
        run: |
          set +e
          URL="https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=OJ:L_202401689"
          echo "--- curl baseline (follows redirects, default Accept-Encoding) ---"
          curl -sSL -D - -o /tmp/curl-body.bin "$URL" | head -40
          echo "curl body bytes: $(stat -c %s /tmp/curl-body.bin 2>/dev/null || echo 0)"
          echo "--- nodeHttpsFetch (the actual production code path) ---"
          node --input-type=module -e "
            import { fetchBuffer } from './scripts/orvyq_fetch_primary_evidence.mjs';
            try {
              const result = await fetchBuffer('$URL', ['eur-lex.europa.eu'], { maxAttempts: 1 });
              console.log('bytes:', result.buffer.length, 'content_type:', result.content_type, 'final_url:', result.final_url);
            } catch (e) {
              console.log('ERR', e.message, e.cause);
            }
          "

      # Derived from the projects that actually exist plus the structural
      # shapes of project-specific data, so a film created after this workflow
      # was written is covered without editing a token list here.
      - name: Scan for project-specific data in system runtime
        run: |
          set +e
          node scripts/orvyq_system_independence_audit.mjs > system-independence-violations.json 2>&1
          echo $? > system-independence.status
          cat system-independence-violations.json
          exit 0

      - name: Upload system-independence report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orvyq-system-independence-${{ github.run_id }}
          retention-days: 7
          path: |
            system-independence-violations.json
            system-independence.status
          if-no-files-found: error

      - name: Stop when project data leaked into system runtime
        run: test "$(cat system-independence.status)" = "0"

      - name: Syntax-check every pipeline script
        run: |
          set -euo pipefail
          find scripts -type f -name '*.mjs' -print0 | xargs -0 -n1 node --check
          python3 -m py_compile scripts/orvyq_speech_qa.py

      - name: Validate canonical schemas and data contracts
        run: |
          set +e
          npm run validate:canonical 2>&1 | tee schema-validation.log
          echo ${PIPESTATUS[0]} > schema-validation.status
          exit 0

      - name: Upload schema validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orvyq-schema-validation-${{ github.run_id }}
          retention-days: 7
          path: |
            schema-validation.log
            schema-validation.status
          if-no-files-found: error

      - name: Stop when schema validation failed
        run: test "$(cat schema-validation.status)" = "0"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Run unit tests
        run: |
          set +e
          npm test 2>&1 | tee unit-tests.log
          echo ${PIPESTATUS[0]} > unit-tests.status
          exit 0

      - name: Upload unit test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orvyq-unit-tests-${{ github.run_id }}
          retention-days: 7
          path: |
            unit-tests.log
            unit-tests.status
          if-no-files-found: error

      - name: Stop when unit tests failed
        run: test "$(cat unit-tests.status)" = "0"

      - name: Check proof/full renderer parity and isolation
        run: npm run orvyq:parity-check

      - name: Install renderer dependencies
        working-directory: templates/remotion
        run: npm ci

      - name: Type-check renderer
        working-directory: templates/remotion
        run: npx tsc --noEmit

      - name: Resolve composition against placeholder data (bundle validation, no render)
        working-directory: templates/remotion
        env:
          FACTFORGE_REMOTION_BROWSER_EXECUTABLE: /opt/hostedtoolcache/chromium/stable/x64/chrome
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          if [ -z "$BROWSER" ]; then
            echo "No system Chrome/Chromium found; skipping composition resolution (type-check above already passed)."
            exit 0
          fi
          export FACTFORGE_REMOTION_BROWSER_EXECUTABLE="$BROWSER"
          npx remotion compositions src/index.ts
