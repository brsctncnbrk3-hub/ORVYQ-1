name: ORVYQ CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install root dependencies
        run: npm ci

      # Temporary diagnostic for the UNABLE_TO_GET_ISSUER_CERT_LOCALLY
      # failure primary-evidence fetch hit against www.ntia.gov. Confirmed
      # so far: the server's chain is www.ntia.gov -> Cloudflare TLS
      # Issuing ECC CA 1 -> SSL.com TLS Transit ECC CA R2 -> "AAA
      # Certificate Services" (Comodo), the server never sends that last
      # root, and NEITHER Node's bundled store NOR the runner's own
      # OpenSSL/OS trust store (verified via `openssl s_client` directly,
      # not just Node) currently trusts it -- so --use-openssl-ca does not
      # help either. Ubuntu's ca-certificates package ships every
      # Mozilla-recognized root as an individual file under
      # /usr/share/ca-certificates/mozilla/ even when disabled by default
      # policy, so check whether the actual AAA Certificate Services file
      # is present on disk (no extra network fetch needed) and, if so,
      # verify it actually closes this exact chain before trusting it.
      # Remove this step once the real fix lands.
      - name: Diagnose ntia.gov TLS trust (locate the missing root)
        run: |
          echo "--- searching the runner's own ca-certificates package for the missing root ---"
          find /usr/share/ca-certificates -iname "*AAA*" 2>/dev/null || true
          grep -i "aaa" /etc/ca-certificates.conf 2>/dev/null || true
          CANDIDATE="$(find /usr/share/ca-certificates -iname "*AAA*Certificate*Services*" 2>/dev/null | head -1)"
          echo "candidate file: ${CANDIDATE:-none}"
          if [ -n "$CANDIDATE" ]; then
            echo "--- subject/issuer of candidate file ---"
            openssl x509 -in "$CANDIDATE" -noout -subject -issuer -fingerprint -sha256
            echo "--- verifying it actually closes the real chain ---"
            cat /etc/ssl/certs/ca-certificates.crt "$CANDIDATE" > /tmp/combined-ca.pem
            echo | openssl s_client -connect www.ntia.gov:443 -servername www.ntia.gov -CAfile /tmp/combined-ca.pem -verify_return_error 2>&1 | grep -E "Verify return code|depth|error" || true
          fi

      # Derived from the projects that actually exist plus the structural
      # shapes of project-specific data, so a film created after this workflow
      # was written is covered without editing a token list here.
      - name: Scan for project-specific data in system runtime
        run: |
          set +e
          node scripts/orvyq_system_independence_audit.mjs > system-independence-violations.json 2>&1
          echo $? > system-independence.status
          cat system-independence-violations.json
          exit 0

      - name: Upload system-independence report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orvyq-system-independence-${{ github.run_id }}
          retention-days: 7
          path: |
            system-independence-violations.json
            system-independence.status
          if-no-files-found: error

      - name: Stop when project data leaked into system runtime
        run: test "$(cat system-independence.status)" = "0"

      - name: Syntax-check every pipeline script
        run: |
          set -euo pipefail
          find scripts -type f -name '*.mjs' -print0 | xargs -0 -n1 node --check
          python3 -m py_compile scripts/orvyq_speech_qa.py

      - name: Validate canonical schemas and data contracts
        run: |
          set +e
          npm run validate:canonical 2>&1 | tee schema-validation.log
          echo ${PIPESTATUS[0]} > schema-validation.status
          exit 0

      - name: Upload schema validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orvyq-schema-validation-${{ github.run_id }}
          retention-days: 7
          path: |
            schema-validation.log
            schema-validation.status
          if-no-files-found: error

      - name: Stop when schema validation failed
        run: test "$(cat schema-validation.status)" = "0"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Run unit tests
        run: |
          set +e
          npm test 2>&1 | tee unit-tests.log
          echo ${PIPESTATUS[0]} > unit-tests.status
          exit 0

      - name: Upload unit test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orvyq-unit-tests-${{ github.run_id }}
          retention-days: 7
          path: |
            unit-tests.log
            unit-tests.status
          if-no-files-found: error

      - name: Stop when unit tests failed
        run: test "$(cat unit-tests.status)" = "0"

      - name: Check proof/full renderer parity and isolation
        run: npm run orvyq:parity-check

      - name: Install renderer dependencies
        working-directory: templates/remotion
        run: npm ci

      - name: Type-check renderer
        working-directory: templates/remotion
        run: npx tsc --noEmit

      - name: Resolve composition against placeholder data (bundle validation, no render)
        working-directory: templates/remotion
        env:
          FACTFORGE_REMOTION_BROWSER_EXECUTABLE: /opt/hostedtoolcache/chromium/stable/x64/chrome
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          if [ -z "$BROWSER" ]; then
            echo "No system Chrome/Chromium found; skipping composition resolution (type-check above already passed)."
            exit 0
          fi
          export FACTFORGE_REMOTION_BROWSER_EXECUTABLE="$BROWSER"
          npx remotion compositions src/index.ts
