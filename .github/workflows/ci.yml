name: ORVYQ CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install root dependencies
        run: npm ci

      # Temporary: crt.sh (prior run of this step) confirmed SSL.com
      # cross-signed the exact intermediate in www.ntia.gov's chain
      # ("SSL.com TLS Transit ECC CA R2") under BOTH the withdrawn Comodo
      # "AAA Certificate Services" root AND a modern one, "SSL.com TLS ECC
      # Root CA 2022" (crt.sh id 8505503577, valid to 2037). The server only
      # sends the old one. This step downloads that specific alternate
      # intermediate from crt.sh, converts it to PEM, and tests whether
      # supplying it (alongside the system's existing trusted roots) lets
      # OpenSSL build the alternate, currently-trusted path -- verifying the
      # real fix before it's pinned into production code. Remove once
      # decided either way.
      - name: Verify the SSL.com modern cross-sign actually closes the chain
        run: |
          set +e
          echo "--- fetching crt.sh id 8505503577, retrying on transient errors ---"
          for attempt in 1 2 3 4 5; do
            STATUS="$(curl -sS -w "%{http_code}" "https://crt.sh/?d=8505503577" -o /tmp/ssl-com-transit-r2-modern.raw)"
            SIZE="$(stat -c %s /tmp/ssl-com-transit-r2-modern.raw 2>/dev/null || echo 0)"
            echo "attempt $attempt: http_status=$STATUS size=$SIZE"
            if [ "$STATUS" = "200" ] && [ "$SIZE" -gt 100 ]; then break; fi
            sleep 5
          done
          echo "--- raw crt.sh response (first 300 bytes, hex) ---"
          head -c 300 /tmp/ssl-com-transit-r2-modern.raw | xxd | head -5
          echo "--- try as DER ---"
          openssl x509 -inform DER -in /tmp/ssl-com-transit-r2-modern.raw -out /tmp/ssl-com-transit-r2-modern.pem 2>&1
          if [ ! -s /tmp/ssl-com-transit-r2-modern.pem ]; then
            echo "--- DER parse failed, trying as PEM directly ---"
            cp /tmp/ssl-com-transit-r2-modern.raw /tmp/ssl-com-transit-r2-modern.pem
            openssl x509 -in /tmp/ssl-com-transit-r2-modern.pem -noout -subject 2>&1
          fi
          echo "--- downloaded cert subject/issuer/fingerprint ---"
          openssl x509 -in /tmp/ssl-com-transit-r2-modern.pem -noout -subject -issuer -fingerprint -sha256 2>&1
          cat /etc/ssl/certs/ca-certificates.crt /tmp/ssl-com-transit-r2-modern.pem > /tmp/combined-ca.pem 2>/dev/null
          echo "--- verifying www.ntia.gov with system store + this one alternate intermediate ---"
          echo | openssl s_client -connect www.ntia.gov:443 -servername www.ntia.gov -CAfile /tmp/combined-ca.pem -verify_return_error 2>&1 | grep -E "Verify return code|depth|error"
          echo "--- full verified PEM (to pin exactly, byte-for-byte) ---"
          cat /tmp/ssl-com-transit-r2-modern.pem
          exit 0

      # Derived from the projects that actually exist plus the structural
      # shapes of project-specific data, so a film created after this workflow
      # was written is covered without editing a token list here.
      - name: Scan for project-specific data in system runtime
        run: |
          set +e
          node scripts/orvyq_system_independence_audit.mjs > system-independence-violations.json 2>&1
          echo $? > system-independence.status
          cat system-independence-violations.json
          exit 0

      - name: Upload system-independence report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orvyq-system-independence-${{ github.run_id }}
          retention-days: 7
          path: |
            system-independence-violations.json
            system-independence.status
          if-no-files-found: error

      - name: Stop when project data leaked into system runtime
        run: test "$(cat system-independence.status)" = "0"

      - name: Syntax-check every pipeline script
        run: |
          set -euo pipefail
          find scripts -type f -name '*.mjs' -print0 | xargs -0 -n1 node --check
          python3 -m py_compile scripts/orvyq_speech_qa.py

      - name: Validate canonical schemas and data contracts
        run: |
          set +e
          npm run validate:canonical 2>&1 | tee schema-validation.log
          echo ${PIPESTATUS[0]} > schema-validation.status
          exit 0

      - name: Upload schema validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orvyq-schema-validation-${{ github.run_id }}
          retention-days: 7
          path: |
            schema-validation.log
            schema-validation.status
          if-no-files-found: error

      - name: Stop when schema validation failed
        run: test "$(cat schema-validation.status)" = "0"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Run unit tests
        run: |
          set +e
          npm test 2>&1 | tee unit-tests.log
          echo ${PIPESTATUS[0]} > unit-tests.status
          exit 0

      - name: Upload unit test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orvyq-unit-tests-${{ github.run_id }}
          retention-days: 7
          path: |
            unit-tests.log
            unit-tests.status
          if-no-files-found: error

      - name: Stop when unit tests failed
        run: test "$(cat unit-tests.status)" = "0"

      - name: Check proof/full renderer parity and isolation
        run: npm run orvyq:parity-check

      - name: Install renderer dependencies
        working-directory: templates/remotion
        run: npm ci

      - name: Type-check renderer
        working-directory: templates/remotion
        run: npx tsc --noEmit

      - name: Resolve composition against placeholder data (bundle validation, no render)
        working-directory: templates/remotion
        env:
          FACTFORGE_REMOTION_BROWSER_EXECUTABLE: /opt/hostedtoolcache/chromium/stable/x64/chrome
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          if [ -z "$BROWSER" ]; then
            echo "No system Chrome/Chromium found; skipping composition resolution (type-check above already passed)."
            exit 0
          fi
          export FACTFORGE_REMOTION_BROWSER_EXECUTABLE="$BROWSER"
          npx remotion compositions src/index.ts
