name: ORVYQ One-Time Verified Migration

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/migrate-orvyq.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: orvyq-one-time-migration
  cancel-in-progress: false

env:
  SOURCE_REPOSITORY: ORVYQ/ORVYQ-YEN-
  SOURCE_BRANCH: agent/systemic-visual-evidence-balance
  SOURCE_SHA: 262d784b6e9d74d7a333bace51ebf1a3c4a99590

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout empty target repository
        uses: actions/checkout@v4
        with:
          path: target
          fetch-depth: 0
          lfs: true
          persist-credentials: true

      - name: Checkout exact verified source snapshot
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_SHA }}
          path: source
          fetch-depth: 1
          lfs: true

      - name: Verify exact source commit and hydrate LFS
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git -C source rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$SOURCE_SHA"
          git -C source lfs install --local
          git -C source lfs pull
          git -C source lfs fsck
          printf '%s\n' "$ACTUAL_SHA" | tee source-sha.txt

          while IFS= read -r -d '' path; do
            if head -c 200 "source/$path" 2>/dev/null | grep -q 'version https://git-lfs.github.com/spec/v1'; then
              echo "::error file=$path::Unhydrated Git LFS pointer detected."
              exit 1
            fi
          done < <(git -C source lfs ls-files -n -z)

      - name: Replace target with source working tree
        shell: bash
        run: |
          set -euo pipefail
          find target -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          rsync -a --delete --exclude='.git/' source/ target/

          cat > target/MIGRATION_MANIFEST.json <<JSON
          {
            "migration_schema": 1,
            "source_repository": "${SOURCE_REPOSITORY}",
            "source_branch": "${SOURCE_BRANCH}",
            "source_sha": "${SOURCE_SHA}",
            "source_ci_run_id": 30667521521,
            "source_ci_conclusion": "success",
            "migration_method": "exact working-tree snapshot with hydrated Git LFS assets",
            "target_repository": "${GITHUB_REPOSITORY}",
            "render_started": false,
            "created_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON

      - name: Verify copied files byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import os
          import subprocess
          from pathlib import Path

          source = Path('source')
          target = Path('target')
          tracked = subprocess.check_output(
              ['git', '-C', str(source), 'ls-files', '-z']
          ).split(b'\0')
          tracked = [p.decode('utf-8') for p in tracked if p]

          def digest(path: Path):
              if path.is_symlink():
                  return ('symlink', os.readlink(path))
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return ('file', h.hexdigest())

          failures = []
          for rel in tracked:
              src = source / rel
              dst = target / rel
              if not dst.exists() and not dst.is_symlink():
                  failures.append(f'missing: {rel}')
                  continue
              if digest(src) != digest(dst):
                  failures.append(f'mismatch: {rel}')

          target_files = {
              str(p.relative_to(target))
              for p in target.rglob('*')
              if (p.is_file() or p.is_symlink()) and '.git' not in p.parts
          }
          allowed = set(tracked) | {'MIGRATION_MANIFEST.json'}
          extras = sorted(target_files - allowed)
          failures.extend(f'extra: {p}' for p in extras)

          if failures:
              print('\n'.join(failures[:200]))
              raise SystemExit(f'copy verification failed with {len(failures)} finding(s)')
          print(f'Verified {len(tracked)} source-controlled paths byte-for-byte.')
          PY

      - name: Enforce GitHub large-file safety
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            rel="${file#target/}"
            filter="$(git -C target check-attr filter -- "$rel" | awk '{print $3}')"
            if [ "$filter" != "lfs" ]; then
              echo "::error file=$rel::File exceeds 99 MB but is not tracked by Git LFS."
              exit 1
            fi
          done < <(find target -path 'target/.git' -prune -o -type f -size +99M -print0)

      - name: Commit and push clean migration snapshot
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ORVYQ Migration Bot"
          git config user.email "orvyq-migration@users.noreply.github.com"
          git lfs install --local
          git add -A
          git status --short
          git commit -m "Migrate ORVYQ from verified source snapshot"
          git lfs push --all origin main
          git push origin HEAD:main

      - name: Report migration failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "ORVYQ migration failed" \
            --body "The one-time migration failed. No render was started. Inspect: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
