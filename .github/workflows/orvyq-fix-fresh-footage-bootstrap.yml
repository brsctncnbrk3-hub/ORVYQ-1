name: ORVYQ Fix Fresh Footage Bootstrap

on:
  push:
    branches:
      - "agent/project-001-clean-rebuild"
    paths:
      - ".github/workflows/orvyq-fix-fresh-footage-bootstrap.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/project-001-clean-rebuild
          fetch-depth: 2
      - name: Patch fresh-project footage ordering
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/orvyq-footage-acquisition.yml')
          text = p.read_text()
          old = '''      - name: Apply claim-bound footage use contracts
        run: node scripts/orvyq_apply_footage_use_contracts.mjs --project-id="$PROJECT_ID"

      - name: Build current claim-bound review queue
        run: node scripts/orvyq_prepare_footage_review_queue.mjs --project-id="$PROJECT_ID"

      - name: Apply all byte-bound visual decision rounds
        shell: bash
        run: |
          set -euo pipefail
          node scripts/orvyq_apply_footage_visual_decisions.mjs --project-id="$PROJECT_ID" | tee footage-decisions.log
'''
          new = '''      - name: Bootstrap fresh footage state
        shell: bash
        run: |
          set -euo pipefail
          ROOT="projects/$PROJECT_ID"
          RUNTIME="$ROOT/assets/footage_acquisition.runtime.json"
          LOCAL_ASSETS="$ROOT/assets/local_assets.json"
          mkdir -p "$ROOT/assets/footage"
          if [ ! -f "$RUNTIME" ]; then
            jq -n --arg project_id "$PROJECT_ID" '{schema_version:"1.3-incremental-demand-led-semantic-metadata",project_id:$project_id,generated_at:null,source:"pexels",license_url:"https://www.pexels.com/license/",planned_asset_count:0,acquired_this_run:0,reused_existing:0,semantic_constraints_applied:0,unresolved_scene_ids:[],provider_search_issues:[],provider_request_count:0,provider_unavailable:false,records:[],pass:false}' > "$RUNTIME"
            echo "FRESH_FOOTAGE_STATE=true" >> "$GITHUB_ENV"
          else
            echo "FRESH_FOOTAGE_STATE=false" >> "$GITHUB_ENV"
          fi
          if [ ! -f "$LOCAL_ASSETS" ]; then
            printf '%s\n' '{"schema_version":1,"assets":[]}' > "$LOCAL_ASSETS"
          fi

      - name: Apply claim-bound footage use contracts
        if: env.FRESH_FOOTAGE_STATE != 'true'
        run: node scripts/orvyq_apply_footage_use_contracts.mjs --project-id="$PROJECT_ID"

      - name: Build current claim-bound review queue
        if: env.FRESH_FOOTAGE_STATE != 'true'
        run: node scripts/orvyq_prepare_footage_review_queue.mjs --project-id="$PROJECT_ID"

      - name: Apply all byte-bound visual decision rounds
        if: env.FRESH_FOOTAGE_STATE != 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/orvyq_apply_footage_visual_decisions.mjs --project-id="$PROJECT_ID" | tee footage-decisions.log
'''
          if old not in text:
            if new in text:
              raise SystemExit(0)
            raise SystemExit('Expected footage workflow block was not found')
          p.write_text(text.replace(old, new))
          PY
      - name: Commit reusable workflow correction
        shell: bash
        run: |
          set -euo pipefail
          git add .github/workflows/orvyq-footage-acquisition.yml
          git config user.name "orvyq-system-bot"
          git config user.email "orvyq-system-bot@users.noreply.github.com"
          git commit -m "Fix fresh-project footage acquisition bootstrap"
          git push origin HEAD:agent/project-001-clean-rebuild
