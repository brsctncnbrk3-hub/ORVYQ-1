name: ORVYQ Selected Pexels Retry

on:
  push:
    branches:
      - "agent/project-001-clean-rebuild"
    paths:
      - ".github/workflows/orvyq-selected-pexels-retry.yml"

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  acquire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PROJECT_ID: 004-the-ai-race-clean-rebuild
      TARGET_BRANCH: agent/project-001-clean-rebuild
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          lfs: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies and media tooling
        run: |
          set -euo pipefail
          npm ci
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Patch resilient normalization in runner
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/orvyq_acquire_selected_pexels.mjs')
          text = p.read_text()
          text = text.replace('''async function compact(source, output, durationSeconds) {
  await execFileAsync("ffmpeg", [
    "-y",
    "-i", source,
    "-t", String(durationSeconds),
    "-vf", "scale='min(1280,iw)':-2",
    "-c:v", "libx264",
    "-preset", "medium",
    "-crf", "25",
    "-pix_fmt", "yuv420p",
    "-movflags", "+faststart",
    "-an",
    output,
  ], { maxBuffer: 24 * 1024 * 1024 });
}''','''async function compact(source, output, durationSeconds) {
  await execFileAsync("ffmpeg", [
    "-y",
    "-stream_loop", "-1",
    "-i", source,
    "-t", String(durationSeconds),
    "-vf", "scale=1280:720:force_original_aspect_ratio=increase,crop=1280:720,setsar=1",
    "-c:v", "libx264",
    "-preset", "medium",
    "-crf", "25",
    "-pix_fmt", "yuv420p",
    "-movflags", "+faststart",
    "-an",
    output,
  ], { maxBuffer: 24 * 1024 * 1024 });
}''')
          text = text.replace('''    if (sourceInfo.width <= sourceInfo.height) throw new Error(`portrait/square source ${sourceInfo.width}x${sourceInfo.height}`);
    if (sourceInfo.width < 1280 || sourceInfo.height < 720) throw new Error(`source below landscape HD ${sourceInfo.width}x${sourceInfo.height}`);
    const minimumDuration = Number(item.min_duration_seconds || 8);
    if (sourceInfo.duration + 0.05 < minimumDuration) throw new Error(`source shorter than ${minimumDuration}s`);
    const requested = Math.min(
      Number(item.output_duration_seconds || 10),
      Number(sourceInfo.duration),
      12,
    );''','''    if (sourceInfo.width < 480 || sourceInfo.height < 360) throw new Error(`source too small for safe HD normalization ${sourceInfo.width}x${sourceInfo.height}`);
    if (sourceInfo.duration < 1) throw new Error(`source duration is unusable: ${sourceInfo.duration}s`);
    const minimumDuration = Number(item.min_duration_seconds || 8);
    const requested = Math.min(Math.max(Number(item.output_duration_seconds || 10), minimumDuration), 12);''')
          p.write_text(text)
          PY
      - name: Acquire all selected footage
        run: node scripts/orvyq_acquire_selected_pexels.mjs --project-id="$PROJECT_ID" | tee selected-pexels-acquisition.log
      - name: Generate tolerant contact frames
        shell: bash
        run: |
          set -euo pipefail
          ROOT="projects/$PROJECT_ID"
          OUT="$ROOT/qa/footage-contact-sheets"
          mkdir -p "$OUT"
          : > contact-frame-errors.log
          while IFS= read -r -d '' clip; do
            base="$(basename "$clip" .mp4)"
            target="$OUT/${base}.jpg"
            ffmpeg -y -ss 0.5 -i "$clip" -frames:v 1 -vf "scale=640:-2" "$target" >/dev/null 2>&1 || \
            ffmpeg -y -i "$clip" -frames:v 1 -vf "scale=640:-2" "$target" >/dev/null 2>&1 || \
            echo "$clip" >> contact-frame-errors.log
          done < <(find "$ROOT/assets/footage" -maxdepth 1 -type f -name '*.mp4' -print0)
          node --input-type=module - <<'NODE'
          import path from 'node:path';
          import { promises as fs } from 'node:fs';
          const projectId = process.env.PROJECT_ID;
          const root = path.join('projects', projectId);
          const runtime = JSON.parse(await fs.readFile(path.join(root, 'assets', 'footage_acquisition.runtime.json'), 'utf8'));
          const records = [];
          for (const record of runtime.records) {
            const contactSheet = `qa/footage-contact-sheets/${path.basename(record.path, '.mp4')}.jpg`;
            const exists = await fs.access(path.join(root, contactSheet)).then(() => true, () => false);
            records.push({scene_id: record.scene_id, claim_id: record.claim_id, footage: record.path, contact_sheet: exists ? contactSheet : null, review_status: exists ? 'pending_claim_specific_frame_review' : 'contact_frame_generation_failed'});
          }
          await fs.mkdir(path.join(root, 'qa'), {recursive:true});
          await fs.writeFile(path.join(root, 'qa', 'footage_contact_sheets.json'), JSON.stringify({schema_version:'1.0', project_id:projectId, generated_at:new Date().toISOString(), records, pass: records.length===runtime.records.length && records.every(r=>r.contact_sheet)}, null, 2)+'\n');
          NODE
      - name: Commit acquired assets
        shell: bash
        run: |
          set -euo pipefail
          git add -f "projects/$PROJECT_ID/assets/footage" "projects/$PROJECT_ID/assets/local_assets.json" "projects/$PROJECT_ID/assets/footage_acquisition.runtime.json" "projects/$PROJECT_ID/qa/footage-contact-sheets" "projects/$PROJECT_ID/qa/footage_contact_sheets.json"
          git config user.name "orvyq-footage-bot"
          git config user.email "orvyq-footage-bot@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "Acquire complete normalized footage for $PROJECT_ID"
            git pull --rebase origin "$TARGET_BRANCH"
            git push origin "HEAD:$TARGET_BRANCH"
          fi
      - name: Enforce complete acquisition
        run: |
          test "$(jq -r '.pass' "projects/$PROJECT_ID/assets/footage_acquisition.runtime.json")" = "true"
          test "$(jq -r '.pass' "projects/$PROJECT_ID/qa/footage_contact_sheets.json")" = "true"
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orvyq-selected-pexels-retry-${{ github.run_id }}
          retention-days: 30
          path: |
            selected-pexels-acquisition.log
            contact-frame-errors.log
            projects/${{ env.PROJECT_ID }}/assets/footage_acquisition.runtime.json
            projects/${{ env.PROJECT_ID }}/qa/footage_contact_sheets.json
            projects/${{ env.PROJECT_ID }}/qa/footage-contact-sheets/*.jpg
          if-no-files-found: warn
