name: ORVYQ Selected Pexels Recovery

on:
  push:
    branches:
      - "agent/project-001-clean-rebuild"
    paths:
      - "projects/004-the-ai-race-clean-rebuild/config/selected_pexels_recovery_request.json"

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: orvyq-selected-pexels-recovery-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PROJECT_ID: 004-the-ai-race-clean-rebuild
      TARGET_BRANCH: agent/project-001-clean-rebuild
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/project-001-clean-rebuild
          lfs: false
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies and media tooling
        run: |
          set -euo pipefail
          npm ci
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Validate acquisition script syntax
        run: node --check scripts/orvyq_acquire_selected_pexels.mjs

      - name: Acquire all selected footage
        shell: bash
        run: |
          set -euo pipefail
          node scripts/orvyq_acquire_selected_pexels.mjs --project-id="$PROJECT_ID" | tee selected-pexels-recovery.log
          test "$(jq -r '.pass' "projects/$PROJECT_ID/assets/footage_acquisition.runtime.json")" = "true"
          test "$(jq '.records | length' "projects/$PROJECT_ID/assets/footage_acquisition.runtime.json")" -eq 20

      - name: Remove unselected acquisition variants
        shell: bash
        run: |
          set -euo pipefail
          ROOT="projects/$PROJECT_ID"
          RUNTIME="$ROOT/assets/footage_acquisition.runtime.json"
          KEEP_FILE="$(mktemp)"
          jq -r '.records[].path' "$RUNTIME" | sort -u > "$KEEP_FILE"
          find "$ROOT/assets/footage" -maxdepth 1 -type f -name '*.mp4' -print0 | while IFS= read -r -d '' clip; do
            relative="${clip#${ROOT}/}"
            if ! grep -Fxq "$relative" "$KEEP_FILE"; then
              rm -f "$clip" "$clip.provenance.json"
            fi
          done
          rm -f "$KEEP_FILE"
          test "$(find "$ROOT/assets/footage" -maxdepth 1 -type f -name '*.mp4' | wc -l)" -eq 20

      - name: Generate claim review frames
        shell: bash
        run: |
          set -euo pipefail
          ROOT="projects/$PROJECT_ID"
          RUNTIME="$ROOT/assets/footage_acquisition.runtime.json"
          OUT="$ROOT/qa/footage-contact-sheets"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          jq -r '.records[].path' "$RUNTIME" | while IFS= read -r relative; do
            clip="$ROOT/$relative"
            base="$(basename "$clip" .mp4)"
            ffmpeg -y -ss 1 -i "$clip" -frames:v 1 -vf "scale=640:-2" "$OUT/${base}.jpg" >/dev/null 2>&1
          done
          test "$(find "$OUT" -type f -name '*.jpg' | wc -l)" -eq 20

      - name: Record pending semantic review queue
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import path from 'node:path';
          import { promises as fs } from 'node:fs';
          const projectId = process.env.PROJECT_ID;
          const root = path.join('projects', projectId);
          const runtime = JSON.parse(await fs.readFile(path.join(root, 'assets', 'footage_acquisition.runtime.json'), 'utf8'));
          const manifest = JSON.parse(await fs.readFile(path.join(root, 'research', 'selected_pexels_manifest.json'), 'utf8'));
          const byScene = new Map(manifest.assets.map((x) => [x.scene_id, x]));
          const records = runtime.records.map((record) => {
            const planned = byScene.get(record.scene_id) || {};
            return {
              scene_id: record.scene_id,
              claim_id: record.claim_id,
              footage: record.path,
              contact_sheet: `qa/footage-contact-sheets/${path.basename(record.path, '.mp4')}.jpg`,
              narration_anchor: planned.narration_anchor,
              semantic_rationale: planned.semantic_rationale,
              semantic_link: planned.semantic_link,
              review_status: 'pending_claim_specific_frame_review'
            };
          });
          await fs.mkdir(path.join(root, 'qa'), {recursive: true});
          await fs.writeFile(path.join(root, 'qa', 'footage_review_queue.json'), JSON.stringify({
            schema_version: '1.0', project_id: projectId, generated_at: new Date().toISOString(), records
          }, null, 2) + '\n');
          NODE

      - name: Upload recovery diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orvyq-selected-pexels-recovery-${{ github.run_id }}
          retention-days: 30
          path: |
            selected-pexels-recovery.log
            projects/${{ env.PROJECT_ID }}/assets/footage_acquisition.runtime.json
            projects/${{ env.PROJECT_ID }}/qa/footage-contact-sheets/**
            projects/${{ env.PROJECT_ID }}/qa/footage_review_queue.json
          if-no-files-found: warn

      - name: Commit recovered footage state
        shell: bash
        run: |
          set -euo pipefail
          git add scripts/orvyq_acquire_selected_pexels.mjs
          git add -f \
            "projects/$PROJECT_ID/assets/footage" \
            "projects/$PROJECT_ID/assets/local_assets.json" \
            "projects/$PROJECT_ID/assets/footage_acquisition.runtime.json" \
            "projects/$PROJECT_ID/qa/footage-contact-sheets" \
            "projects/$PROJECT_ID/qa/footage_review_queue.json"
          git config user.name "orvyq-footage-bot"
          git config user.email "orvyq-footage-bot@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No recovered footage changes to commit"
            exit 0
          fi
          git commit -m "Complete selected footage acquisition for $PROJECT_ID"
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"

      - name: Report result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          DETAILS="$(jq -c '{planned_asset_count,acquired_this_run,unresolved_scene_ids,pass}' "projects/$PROJECT_ID/assets/footage_acquisition.runtime.json" 2>/dev/null || true)"
          BODY="Project 004 selected footage recovery finished with **${JOB_STATUS}**. Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. No video render was started."
          test -z "$DETAILS" || BODY="${BODY}"$'\n\n```json\n'"${DETAILS}"$'\n```'
          gh api "repos/$GITHUB_REPOSITORY/issues/5/comments" -f body="$BODY" ||
            echo "::warning::Could not post recovery result to PR #5."
