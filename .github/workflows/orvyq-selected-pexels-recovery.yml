name: ORVYQ Selected Pexels Recovery

on:
  push:
    branches:
      - "agent/project-001-clean-rebuild"
    paths:
      - "projects/004-the-ai-race-clean-rebuild/config/selected_pexels_recovery_request.json"

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: orvyq-selected-pexels-recovery-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PROJECT_ID: 004-the-ai-race-clean-rebuild
      TARGET_BRANCH: agent/project-001-clean-rebuild
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/project-001-clean-rebuild
          lfs: false
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies and media tooling
        run: |
          set -euo pipefail
          npm ci
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Validate acquisition and override scripts
        run: |
          node --check scripts/orvyq_acquire_selected_pexels.mjs
          node --check scripts/orvyq_apply_footage_candidate_overrides.mjs

      - name: Apply reviewed footage candidate replacements
        run: node scripts/orvyq_apply_footage_candidate_overrides.mjs --project-id="$PROJECT_ID"

      - name: Acquire all selected footage
        shell: bash
        run: |
          set -euo pipefail
          node scripts/orvyq_acquire_selected_pexels.mjs --project-id="$PROJECT_ID" | tee selected-pexels-recovery.log
          RUNTIME="projects/$PROJECT_ID/assets/footage_acquisition.runtime.json"
          test "$(jq -r '.pass' "$RUNTIME")" = "true"
          test "$(jq '.records | length' "$RUNTIME")" -eq 20
          test "$(jq '.unresolved_scene_ids | length' "$RUNTIME")" -eq 0

      - name: Confirm replacement scenes resolved to new candidates
        shell: bash
        run: |
          set -euo pipefail
          ROOT="projects/$PROJECT_ID"
          RUNTIME="$ROOT/assets/footage_acquisition.runtime.json"
          OVERRIDES="$ROOT/config/footage_candidate_overrides.json"
          jq -r '.overrides[] | [.scene_id, (.replaced_provider_asset_ids | join(","))] | @tsv' "$OVERRIDES" | while IFS=$'\t' read -r scene rejected; do
            selected="$(jq -r --arg scene "$scene" '.records[] | select(.scene_id == $scene) | .provider_asset_id' "$RUNTIME")"
            test -n "$selected"
            if printf ',%s,' "$rejected" | grep -Fq ",$selected,"; then
              echo "::error::$scene resolved back to rejected provider asset $selected"
              exit 1
            fi
          done

      - name: Remove unselected acquisition variants
        shell: bash
        run: |
          set -euo pipefail
          ROOT="projects/$PROJECT_ID"
          RUNTIME="$ROOT/assets/footage_acquisition.runtime.json"
          KEEP_FILE="$(mktemp)"
          jq -r '.records[].path' "$RUNTIME" | sort -u > "$KEEP_FILE"
          find "$ROOT/assets/footage" -maxdepth 1 -type f -name '*.mp4' -print0 | while IFS= read -r -d '' clip; do
            relative="${clip#${ROOT}/}"
            if ! grep -Fxq "$relative" "$KEEP_FILE"; then
              rm -f "$clip" "$clip.provenance.json"
            fi
          done
          rm -f "$KEEP_FILE"
          test "$(find "$ROOT/assets/footage" -maxdepth 1 -type f -name '*.mp4' | wc -l)" -eq 20
          test "$(find "$ROOT/assets/footage" -maxdepth 1 -type f -name '*.mp4.provenance.json' | wc -l)" -eq 20

      - name: Verify selected media and provenance
        shell: bash
        run: |
          set -euo pipefail
          ROOT="projects/$PROJECT_ID"
          RUNTIME="$ROOT/assets/footage_acquisition.runtime.json"
          jq -r '.records[].path' "$RUNTIME" | while IFS= read -r relative; do
            clip="$ROOT/$relative"
            test -s "$clip"
            test -s "$clip.provenance.json"
            dimensions="$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "$clip")"
            test "$dimensions" = "1280x720"
          done

      - name: Upload acquisition diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orvyq-selected-pexels-recovery-${{ github.run_id }}
          retention-days: 30
          path: |
            selected-pexels-recovery.log
            projects/${{ env.PROJECT_ID }}/assets/footage_acquisition.runtime.json
            projects/${{ env.PROJECT_ID }}/assets/local_assets.json
            projects/${{ env.PROJECT_ID }}/research/selected_pexels_manifest.json
            projects/${{ env.PROJECT_ID }}/config/footage_candidate_overrides.json
          if-no-files-found: warn

      - name: Commit recovered footage state
        shell: bash
        run: |
          set -euo pipefail
          git add \
            scripts/orvyq_acquire_selected_pexels.mjs \
            scripts/orvyq_apply_footage_candidate_overrides.mjs \
            "projects/$PROJECT_ID/research/selected_pexels_manifest.json" \
            "projects/$PROJECT_ID/config/footage_candidate_overrides.json"
          git add -f \
            "projects/$PROJECT_ID/assets/footage" \
            "projects/$PROJECT_ID/assets/local_assets.json" \
            "projects/$PROJECT_ID/assets/footage_acquisition.runtime.json"
          git config user.name "orvyq-footage-bot"
          git config user.email "orvyq-footage-bot@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No recovered footage changes to commit"
            exit 0
          fi
          git commit -m "Replace rejected footage for $PROJECT_ID"
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"

      - name: Report result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          DETAILS="$(jq -c '{planned_asset_count,acquired_this_run,unresolved_scene_ids,pass,records: [.records[] | select(.scene_id == "scene_001" or .scene_id == "scene_003" or .scene_id == "scene_008" or .scene_id == "scene_016") | {scene_id,provider_asset_id}]}' "projects/$PROJECT_ID/assets/footage_acquisition.runtime.json" 2>/dev/null || true)"
          BODY="Project 004 reviewed footage replacement finished with **${JOB_STATUS}**. Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. No video render was started."
          test -z "$DETAILS" || BODY="${BODY}"$'\n\n```json\n'"${DETAILS}"$'\n```'
          gh api "repos/$GITHUB_REPOSITORY/issues/5/comments" -f body="$BODY" ||
            echo "::warning::Could not post replacement result to PR #5."
