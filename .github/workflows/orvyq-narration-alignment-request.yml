name: ORVYQ Narration Alignment Request

on:
  push:
    branches:
      - "agent/**"
      - "claude/**"
    paths:
      - "projects/*/config/narration_alignment_request.json"

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: orvyq-narration-alignment-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          lfs: true
          fetch-depth: 2

      - name: Resolve selected project
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t REQUESTS < <(
            git diff --name-only "$GITHUB_SHA^" "$GITHUB_SHA" |
              grep -E '^projects/[^/]+/config/narration_alignment_request\.json$' || true
          )
          test "${#REQUESTS[@]}" -eq 1
          REQUEST="${REQUESTS[0]}"
          test "$(jq -r '.status' "$REQUEST")" = "requested"
          PROJECT_ID="$(jq -r '.project_id' "$REQUEST")"
          test -s "projects/$PROJECT_ID/assets/audio/final_voice.mp3"
          test -s "projects/$PROJECT_ID/voice/voice_script.txt"
          echo "PROJECT_ID=$PROJECT_ID" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Validate project without requiring production-ready status
        run: |
          node --input-type=module -e "
            import { loadProductionPolicy } from './scripts/lib/orvyq-project-profile.mjs';
            await loadProductionPolicy(process.env.PROJECT_ID, { requireReady: false });
          "

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Cache the tiny.en Whisper model so a burst of runs doesn't trip
      # Hugging Face's anonymous-request rate limit (observed directly:
      # Candidate Validation run 30894604810 failed narration QA on a
      # "429 Too Many Requests" from huggingface.co, unrelated to any
      # actual audio or narration problem).
      - name: Cache Whisper ASR model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-tiny.en-${{ runner.os }}

      - name: Install speech tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install --disable-pip-version-check faster-whisper==1.2.0 requests==2.32.5

      - name: Run full-duration speech QA
        shell: bash
        run: |
          set +e
          python scripts/orvyq_speech_qa.py --project-id "$PROJECT_ID" \
            --media "projects/$PROJECT_ID/assets/audio/final_voice.mp3" \
            --output-name full_narration_speech_qa.json \
            --model tiny.en > speech-qa.log 2>&1
          echo $? > speech-qa.status
          cat speech-qa.log
          test "$(cat speech-qa.status)" = "0"

      - name: Build canonical narration alignment
        run: node scripts/orvyq_narration_alignment.mjs --project-id="$PROJECT_ID"

      - name: Commit narration alignment
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git add \
            "projects/$PROJECT_ID/qa/full_narration_speech_qa.json" \
            "projects/$PROJECT_ID/voice/narration_alignment.json"
          git config user.name "orvyq-narration-bot"
          git config user.email "orvyq-narration-bot@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "Narration alignment unchanged."
            exit 0
          fi
          git commit -m "Record narration alignment for $PROJECT_ID"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Validate automation-authored head commit
        if: steps.commit.outputs.pushed == 'true'
        uses: ./.github/actions/dispatch-required-checks
        with:
          branch: ${{ github.ref_name }}

      - name: Upload alignment diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orvyq-narration-alignment-${{ env.PROJECT_ID }}-${{ github.run_id }}
          retention-days: 14
          path: |
            speech-qa.log
            speech-qa.status
            projects/${{ env.PROJECT_ID }}/qa/full_narration_speech_qa.json
            projects/${{ env.PROJECT_ID }}/voice/narration_alignment.json
          if-no-files-found: warn
