name: ORVYQ Run Selected Pexels Project 004

on:
  push:
    branches:
      - "agent/project-001-clean-rebuild"
    paths:
      - ".github/workflows/orvyq-run-selected-pexels-project004.yml"

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: orvyq-selected-pexels-project004
  cancel-in-progress: true

jobs:
  acquire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PROJECT_ID: 004-the-ai-race-clean-rebuild
      TARGET_BRANCH: agent/project-001-clean-rebuild
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          lfs: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies and media tooling
        run: |
          npm ci
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Acquire selected licensed Pexels footage
        shell: bash
        run: node scripts/orvyq_acquire_selected_pexels.mjs --project-id="$PROJECT_ID" | tee selected-pexels-acquisition.log
      - name: Generate tolerant contact frames
        shell: bash
        run: |
          set -u
          ROOT="projects/$PROJECT_ID"
          OUT="$ROOT/qa/footage-contact-sheets"
          mkdir -p "$OUT"
          find "$ROOT/assets/footage" -maxdepth 1 -type f -name '*.mp4' -print0 | while IFS= read -r -d '' clip; do
            base="$(basename "$clip" .mp4)"
            ffmpeg -y -ss 0.25 -i "$clip" -frames:v 1 -vf "scale=640:-2" "$OUT/${base}.jpg" >/dev/null 2>&1 || \
            ffmpeg -y -i "$clip" -frames:v 1 -vf "scale=640:-2" "$OUT/${base}.jpg" >/dev/null 2>&1 || \
            echo "::warning::Could not create contact frame for $clip"
          done
          node --input-type=module - <<'NODE'
          import path from 'node:path'; import { promises as fs } from 'node:fs';
          const projectId=process.env.PROJECT_ID, root=path.join('projects',projectId);
          const runtime=JSON.parse(await fs.readFile(path.join(root,'assets','footage_acquisition.runtime.json'),'utf8'));
          const records=[];
          for (const record of runtime.records) {
            const contact=`qa/footage-contact-sheets/${path.basename(record.path,'.mp4')}.jpg`;
            const exists=await fs.access(path.join(root,contact)).then(()=>true).catch(()=>false);
            records.push({scene_id:record.scene_id,claim_id:record.claim_id,footage:record.path,contact_sheet:exists?contact:null,review_status:exists?'pending_claim_specific_frame_review':'contact_frame_missing'});
          }
          await fs.mkdir(path.join(root,'qa'),{recursive:true});
          await fs.writeFile(path.join(root,'qa','footage_contact_sheets.json'),JSON.stringify({schema_version:'1.0',project_id:projectId,generated_at:new Date().toISOString(),records},null,2)+'\n');
          NODE
      - name: Commit acquisition state even when incomplete
        shell: bash
        run: |
          set -euo pipefail
          git add -f "projects/$PROJECT_ID/assets/footage" "projects/$PROJECT_ID/assets/local_assets.json" "projects/$PROJECT_ID/assets/footage_acquisition.runtime.json" "projects/$PROJECT_ID/qa/footage-contact-sheets" "projects/$PROJECT_ID/qa/footage_contact_sheets.json"
          git config user.name "orvyq-footage-bot"
          git config user.email "orvyq-footage-bot@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "Persist selected footage acquisition state for $PROJECT_ID"
            git pull --rebase origin "$TARGET_BRANCH"
            git push origin "HEAD:$TARGET_BRANCH"
          fi
      - name: Enforce complete acquisition after state is preserved
        run: jq -e '.pass == true and (.records|length) == .planned_asset_count' "projects/$PROJECT_ID/assets/footage_acquisition.runtime.json"
