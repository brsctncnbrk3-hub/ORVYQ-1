name: Manual ORVYQ Verified Migration

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: orvyq-one-time-migration
  cancel-in-progress: false

env:
  SOURCE_REPOSITORY: ORVYQ/ORVYQ-YEN-
  SOURCE_BRANCH: agent/systemic-visual-evidence-balance
  SOURCE_SHA: 262d784b6e9d74d7a333bace51ebf1a3c4a99590

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          path: target
          fetch-depth: 0
          lfs: true
          persist-credentials: true

      - name: Checkout exact verified source snapshot
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_SHA }}
          path: source
          fetch-depth: 1
          lfs: true

      - name: Verify source SHA and hydrate LFS
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          git -C source lfs install --local
          git -C source lfs pull
          git -C source lfs fsck

          while IFS= read -r path; do
            [ -n "$path" ] || continue
            if head -c 200 "source/$path" 2>/dev/null | grep -q 'version https://git-lfs.github.com/spec/v1'; then
              echo "::error file=$path::Unhydrated Git LFS pointer detected."
              exit 1
            fi
          done < <(git -C source lfs ls-files -n)

      - name: Replace target with exact source working tree
        shell: bash
        run: |
          set -euo pipefail
          find target -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          rsync -a --delete --exclude='.git/' source/ target/
          cat > target/MIGRATION_MANIFEST.json <<JSON
          {
            "migration_schema": 1,
            "source_repository": "${SOURCE_REPOSITORY}",
            "source_branch": "${SOURCE_BRANCH}",
            "source_sha": "${SOURCE_SHA}",
            "source_ci_run_id": 30667521521,
            "source_ci_conclusion": "success",
            "migration_method": "exact working-tree snapshot with hydrated Git LFS assets; workflows installed separately through the GitHub connector",
            "target_repository": "${GITHUB_REPOSITORY}",
            "render_started": false,
            "created_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON

      - name: Verify all source-controlled paths byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import os
          import subprocess
          from pathlib import Path

          source = Path('source')
          target = Path('target')
          tracked = [
              p.decode('utf-8')
              for p in subprocess.check_output(
                  ['git', '-C', str(source), 'ls-files', '-z']
              ).split(b'\0')
              if p
          ]

          def digest(path: Path):
              if path.is_symlink():
                  return ('symlink', os.readlink(path))
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return ('file', h.hexdigest())

          failures = []
          for rel in tracked:
              src = source / rel
              dst = target / rel
              if not dst.exists() and not dst.is_symlink():
                  failures.append(f'missing: {rel}')
              elif digest(src) != digest(dst):
                  failures.append(f'mismatch: {rel}')

          target_files = {
              str(p.relative_to(target))
              for p in target.rglob('*')
              if (p.is_file() or p.is_symlink()) and '.git' not in p.parts
          }
          allowed = set(tracked) | {'MIGRATION_MANIFEST.json'}
          failures.extend(f'extra: {p}' for p in sorted(target_files - allowed))

          if failures:
              print('\n'.join(failures[:200]))
              raise SystemExit(f'{len(failures)} verification finding(s)')
          print(f'Verified {len(tracked)} source-controlled paths byte-for-byte.')
          PY

      - name: Enforce GitHub large-file safety
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            rel="${file#target/}"
            filter="$(git -C target check-attr filter -- "$rel" | awk '{print $3}')"
            test "$filter" = "lfs" || {
              echo "::error file=$rel::File exceeds 99 MB and is not tracked by Git LFS."
              exit 1
            }
          done < <(find target -path 'target/.git' -prune -o -type f -size +99M -print0)

      - name: Stage every tracked non-workflow path exactly
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail

          # GitHub Actions tokens cannot create or update workflow files unless
          # they have the separate workflows permission. Keep the currently
          # authorized bootstrap workflows unchanged; the verified source
          # workflows are installed afterward through the GitHub connector.
          git restore --source=HEAD --staged --worktree .github/workflows

          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          paths = [
              p for p in subprocess.check_output(
                  ['git', '-C', '../source', 'ls-files', '-z']
              ).split(b'\0')
              if p and not p.startswith(b'.github/workflows/')
          ]
          Path('../source-nonworkflow-paths.z').write_bytes(
              b''.join(path + b'\0' for path in paths)
          )
          print(f'Prepared {len(paths)} source-controlled non-workflow paths for forced staging.')
          PY

          git add -A
          git restore --source=HEAD --staged --worktree .github/workflows
          git add -f --pathspec-from-file=../source-nonworkflow-paths.z --pathspec-file-nul
          git add -f MIGRATION_MANIFEST.json

          python3 - <<'PY'
          import subprocess

          source = {
              p.decode('utf-8')
              for p in subprocess.check_output(
                  ['git', '-C', '../source', 'ls-files', '-z']
              ).split(b'\0')
              if p and not p.startswith(b'.github/workflows/')
          }
          target = {
              p.decode('utf-8')
              for p in subprocess.check_output(
                  ['git', 'ls-files', '-z']
              ).split(b'\0')
              if p and not p.startswith(b'.github/workflows/')
          }
          expected = source | {'MIGRATION_MANIFEST.json'}
          missing = sorted(expected - target)
          extra = sorted(target - expected)
          if missing or extra:
              print('Missing staged paths:', missing[:100])
              print('Unexpected staged paths:', extra[:100])
              raise SystemExit('staged path-set verification failed')
          print(f'Index contains the exact expected non-workflow path set: {len(expected)} paths.')
          PY

      - name: Commit and push verified non-workflow snapshot
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ORVYQ Migration Bot"
          git config user.email "orvyq-migration@users.noreply.github.com"
          git lfs install --local
          git status --short
          git commit -m "Migrate ORVYQ from verified source snapshot"
          git lfs push --all origin HEAD
          git push origin HEAD:main

      - name: Report migration failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "ORVYQ migration failed" \
            --body "The verified migration attempt failed. No render was started. Inspect: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
